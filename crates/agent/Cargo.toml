[package]
name = "shipdeck-agent"
description = "The helper the engine starts on a server over SSH: JSON-RPC on stdin and stdout."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "shipdeck_agent"
path = "src/lib.rs"

[[bin]]
name = "shipdeck-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base16ct.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shipdeck-protocol.workspace = true
tar.workspace = true
tokio.workspace = true
zstd = { version = "0.14.3", default-features = false }

[package.metadata.dist]
dist = true
# The agent is an archive only: people never install it by hand.
installers = []
auto-includes = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
unix-archive = ".tar.gz"

[package.metadata.dist.min-glibc-version]
"*" = "2.31"
