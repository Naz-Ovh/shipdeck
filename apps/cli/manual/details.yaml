# The text of every topic in index.yaml, under the same key.
#
# see:  optional, related topic keys, printed at the end
# text: the page; plain text, at most 100 characters a line, no tabs
#
# For people using shipdeck and the agents helping them: what it does, how
# to use it, why it behaves as it does, and what to do when it fails. Full
# sentences, one fact once. Properties are documented in configs.yaml; name
# them by path instead of repeating them. A change in behaviour changes the
# page that describes it.

overview:
  see: [quickstart, agents, steps, releases]
  text: |
    shipdeck builds an app on your own machine, ships it to a Linux server over SSH, and runs it
    there as a systemd service or a PM2 app. Every deploy is kept on the server as its own
    release, so any earlier release can go live again in seconds.

    It exists for servers too small to build on. Whatever the language (Rust, Go, Node.js, Python,
    Java, Dart, Bun), the build happens on your PC and only the files you list travel. Each step
    of a deploy can run your own commands, and the deploy file says plainly which run on your PC
    and which on the server.

    Terms used everywhere in this manual:
    - project folder: the folder you run shipdeck in, or the one named by -C.
    - root file: shipdeck.yaml or .shipdeck in the project folder; -c names another one. It
      holds `root: true` and lists the deploys by name, each a deploy file or written in place.
    - deploy file: one whole deploy in one file: the server, the release and every app. It can
      live anywhere, under any name.
    - app: one running program or one static site, under `apps.<app>` in the deploy file.
    - release: the result of one deploy, with an id such as v1.4.0-ab12cd3-20261015.120000
      (version, git commit, UTC build time). It lives in <dir>/releases/<id>/.
    - current: the symlink <dir>/current, pointing at the live release. systemd and PM2 only ever
      use current/..., so going live or rolling back is one rename plus a restart.

    One deploy runs twelve steps: preflight, build, upload, setup, backup, switch, restart, nginx,
    health, done, rollback and failed (see steps). What a failure does depends on where it happens:
    - before the switch (preflight to backup): the new release is removed; the live one never
      stopped serving;
    - in switch, restart, nginx or health: the previous release is put back, after asking by
      default;
    - in done: only a warning; the new release stays live.
    The only downtime is the restart, about 1-2 seconds for most apps.

    There are two ways to drive it, over the same engine:
    - the TUI, `shipdeck`: interactive, shows every step live and asks before anything risky;
    - headless commands for scripts, CI and agents: `deploy`, `rollback`, `releases`,
      `server-info`, `work` and `events`. They print plain lines, never wait for an
      answer, and end with an exit code that says what happened.
    `shipdeck tree` prints what the next release will hold, without connecting anywhere.

    What shipdeck does not do: install runtimes on the server (preflight checks they are there),
    deploy one app to several hosts, go through jump hosts, or store logins in a deploy file.
    nginx management and oxmgr are parsed and checked, but a deploy that uses them stops at
    preflight.

quickstart:
  see: [cli.init, server, permissions, cli.deploy, rollback]
  text: |
    From nothing to a live app:
    1. Install shipdeck (see install) and log in to the server once by hand, so its host key is
       known: `ssh deploy@prod`.
    2. Make sure the SSH user is root, or has full password-free sudo (see permissions). There
       is nothing else to prepare: the first connection installs the agent by itself.
    3. Write a root file and a deploy file, or let init do it:
         shipdeck init my-api --preset nodejs --host prod --manager systemd
       That writes shipdeck.yaml, deploy.yaml, an empty .env and a .gitignore.
    4. Fill in the values marked with `#` or a comment, then look over the deploy:
         shipdeck tree my-api
    5. Deploy: `shipdeck deploy my-api`, or just `shipdeck` for the TUI.
    6. Later, put an older release back: `shipdeck releases my-api` lists them, and
       `shipdeck rollback my-api <release>` makes one live again.

    A minimal deploy file, beside the root file:
      name: my-api
      server:
        ssh: { host: prod, user: deploy }
        dir: /opt/my-api
      apps:
        my-api:
          source: .
          files: [dist, package.json, .env]
          process:
            start: node dist/main.js
            env_file: .env
            systemd: {}
          steps:
            health:
              url: http://127.0.0.1:3000/

    The root file, for one deploy:
      root: true
      deploys:
        production: deploy.yaml

    A deploy can also be written in the root file, in place of a file's path:
      root: true
      deploys:
        staging:
          name: my-api
          server: { ssh: { host: prod, user: deploy }, dir: /opt/staging }
          apps:
            my-api:
              source: .
              files: [dist]
              static: true

    Then `shipdeck deploy production`. Everything else has a default; `shipdeck man configs`
    lists every property.

agents:
  see: [cli, exit-codes, config.problems]
  text: |
    For an agent or a script driving shipdeck:
    - Run headless commands; they never prompt. `--key-file`, `--key-text`, `--password`,
      SHIPDECK_SSH_KEY and SHIPDECK_PASSWORD answer the login. `--trust-new-host` accepts a new
      host key once; a changed key is still refused.
    - Read the exit code (see exit-codes); do not parse the log text. The log may change.
    - Point at the project folder with -C, or with the working directory. -c names another root
      file. With no root file and no deploy file named, shipdeck stops and says which names it
      expected.
    - `shipdeck deploy <deploy>` takes one or more deploys. A name comes from the root file; an
      argument ending in .yaml or .yml is a deploy file, and needs no root file. Without one it
      uses the only deploy of the root file, and refuses when there are several.
    - A config mistake is reported with its file, line and column, and the run stops before any
      connection. Treat any non-zero exit as "nothing is live that was not live before", except
      codes 3 and 5 (see exit-codes).
    - `shipdeck tree --json` prints one JSON object per path of the next release, from local files
      only. It is the cheapest check that a config collects what you expect.
    - Do not edit the server by hand during a deploy. shipdeck holds a project lock, and a second
      operation on the same project is refused with exit code 1.
    - Never put a secret in the deploy file. Use an env file that the app ships, and keep it out
      of git.

install:
  see: [quickstart]
  text: |
    shipdeck is one binary for your PC. Nothing of shipdeck is installed on the server.

    Install script, for Linux and macOS:
      curl -LsSf https://shipdeck.naz.ovh/install.sh | sh                       # latest
      curl -LsSf https://shipdeck.naz.ovh/install.sh | sh -s -- -V=v<version>   # one release
    It installs to ~/.local/bin; add that to PATH if your shell does not have it. On Linux it
    picks the gnu build when the system has glibc 2.28 or newer, and a static musl build otherwise
    (Alpine, older distributions). Builds exist for x86_64 and aarch64 Linux and both macOS
    architectures.

    With cargo-binstall, the same prebuilt binary into cargo's bin folder:
      cargo binstall --git https://github.com/Naz-Ovh/shipdeck shipdeck
    binstall picks the build itself: gnu on Linux with glibc, musl on musl systems such as Alpine.

    With bin (github.com/marcosnils/bin):
      bin install github.com/Naz-Ovh/shipdeck
    On Linux it asks which archive: linux-gnu, or linux-musl on Alpine or glibc older than 2.28.

    From source, with a stable Rust toolchain (1.88 or newer):
      cargo install --git https://github.com/Naz-Ovh/shipdeck shipdeck

    Windows: no prebuilt binary yet; install from source as above (Rust's MSVC toolchain). Linux
    is the main platform, then Windows, then macOS. On Windows:
    - Git for Windows is required: local commands run in its sh.exe, so the same deploy file
      works on every PC. shipdeck takes the first sh.exe of: --gitshell-path or
      SHIPDECK_GITSHELL_PATH; the one `git var GIT_SHELL_PATH` names; sh.exe in a folder on
      PATH; %ProgramFiles%\Git\usr\bin, %LOCALAPPDATA%\Programs\Git\usr\bin and scoop's git.
    - Files have no Unix modes, so every shipped file gets 0644; .env files 0600 and
      apps.<app>.binary 0755 as on Linux. A script that must run on the server needs a
      `chmod +x` in a setup command.
    - Config files must use LF line endings, and paths in them use `/`.

    Updating: run the install script or `cargo binstall` again, or `bin update shipdeck`. Then
    update the `# yaml-language-server: $schema=...` line of each config file to the new tag, so
    editors complete the new version's fields.

cli:
  see: [login, exit-codes, cli.tui, cli.deploy]
  text: |
    Every command and flag. `shipdeck --help` and `shipdeck <COMMAND> --help` print the same from
    the binary.

    Choosing what to read:
      shipdeck                                  the TUI, on the root file in this folder
      shipdeck deploy production                the root file, then that deploy
      shipdeck deploy scripts/p.yaml            that deploy file only; no root file is read
      shipdeck -C apps/api deploy production    as if started in apps/api
      shipdeck -c ops/root.yaml deploy staging  another root file; the folder does not change

    A <DEPLOY> argument is a name from the root file, or a file ending in .yaml or .yml. Only
    the ending decides: ./production is refused, not read as either.

    The commands:
      deploy <DEPLOY>...      build and deploy, one after another; the first failure stops the rest
      rollback <DEPLOY> <RELEASE>   make an older release live
      releases [DEPLOY]       list the releases on the server, newest first
      server-info [DEPLOY]    Linux, CPU, memory, disk, uptime and tools on the server
      work [DEPLOY]           what an interrupted operation left; --cleanup removes it
      events [DEPLOY]         the events saved on the server, oldest first
      tree [DEPLOY]           every path of the next release; never connects
      init                    write a root file and a deploy file
      engine                  the protocol loop an app drives; not for people
      man                     this manual

    Flags, on every command:
      -C, --cwd DIR           the project folder; every relative path starts there
      -c, --config FILE       the root file to read, instead of shipdeck.yaml or .shipdeck
      --key-file PATH         log in with a private key file
      --key-text TEXT         log in with a key's text (it shows in `ps`)
      --password PASSWORD     log in with a password (it lands in history)
      -H, --host HOST         use this host instead of server.ssh.host (one deploy; see hosts)
      -P, --port PORT         use this port instead of server.ssh.port (one deploy)
      -U, --user USER         use this user instead of server.ssh.user (one deploy)
      -E, --env-file FILE     read this env file instead of .env (see env-file)
      --no-shell-env          server commands skip the login shell's startup files
      --trust-new-host        record a server's key the first time
    `deploy` also takes `--on-failure rollback|keep` (see cli.deploy) and `--allow-unchanged`.

    The TUI is `shipdeck` with no command. Its screens and keys are in cli.tui.

cli.tui:
  see: [cli, service-control, cli.rollback]
  text: |
    `shipdeck` with no command opens the TUI on the root file in the project folder. It lists
    the deploys of that file, including ones written in place, and follows what the engine
    reports.

    Screens, by Tab or 1, 2, 3:
    - Deploys: every deploy, what is live on its server, and the selected one's apps, steps and
      policy.
    - Operation: the steps of the running or last deploy, with a progress bar, and its log.
    - Releases: every release on the server, newest first. Enter rolls one back, D opens it.
    Keys on Deploys: up/down or j/k to move; Enter or d to deploy; r for releases; c connects or
    disconnects the server; s refreshes; x offers to remove unfinished files; `:` opens a command
    line (:logs, :restart, :stop, :start).
    Keys on Operation: up/down, PageUp/PageDown, g/G for the log; r for releases; Esc back.
    Keys on Releases: up/down to move, Enter to roll back, D for the release details, r to
    refresh, Esc back.
    `q` quits; during an operation it asks first.

    The TUI never prepares a server. It asks for a password as a dialog when the login needs
    one, and the deploy waits for the answer.

    What a deploy dialog says: the target, the process name, the build command, and what happens
    on a failure after the switch. A rollback dialog says whether the target comes back from a
    backup, in which case its setup runs again.

cli.deploy:
  see: [cli, steps, rollback, exit-codes]
  text: |
    `shipdeck deploy <DEPLOY>...` builds and deploys without the TUI. Without a name it uses the
    only deploy of the project.

    What a change is: the release's content fingerprint covers every shipped file, every app's
    process file, and the settings. If it equals the live release's, shipdeck asks nothing
    headless and stops with exit code 6, unless `--allow-unchanged` is given. The log says which
    release is the same.

    --on-failure maps onto `release.steps.rollback.mode` and wins over the file, but only
    when it is given:
      --on-failure rollback   mode: auto   roll back at once
      --on-failure keep       mode: off    never roll back on its own
    Without the flag, the deploy uses the file's mode, so `mode: off` keeps the failed
    release live. The flag cannot choose `ask`; a headless deploy never waits for an answer,
    and `ask` with nobody to answer rolls back after `ask_secs`.

    Output: one block per deploy, one line per step as it ends, and the outcome with its exit
    code. Everything goes to stderr except `releases` and `tree`, which print to stdout.

    A second deploy naming several deploys runs them in order; the first non-zero exit stops the
    rest, and the ones not run are named.

cli.rollback:
  see: [rollback, releases, exit-codes]
  text: |
    `shipdeck rollback <DEPLOY> <RELEASE>` makes an older release live again. The release id is
    exactly what `shipdeck releases` prints, such as v1.4.0-ab12cd3-20261015.120000.

    A release that is unpacked is switched as it is. A release kept only as its backup is
    unpacked, its shared folders are linked, and its setup.server runs again, because the backup
    does not hold what setup made. Either way its own health checks must pass, then its done
    commands run.

    The release's own settings decide what runs: setup.server, health.server and done come from
    the restored release's .shipdeck/settings.json. The rollback and failed commands come from
    the deploy file you ran. A release from before config format 2 has no settings file; the
    rollback is refused and says to deploy that version again.

    A release shipdeck did not name is never used: releases are named by shipdeck, and a folder
    made by hand is not in the list.

cli.releases:
  see: [releases, rollback]
  text: |
    `shipdeck releases [DEPLOY]` lists what is on the server, newest first, to stdout:
      release                              kind        current  backup     size
      v1.4.0-ab12cd3-20261015.120000       open        yes      yes      12.4 MiB
      v1.3.9-def5678-20261013.090000       open                 yes       5.1 MiB
      v1.3.8-0a1b2c3-20261010.170000       compressed  -        yes       2.2 MiB
    `kind` is open (unpacked, ready to switch to) or compressed (only its backup). `current` is
    what the current link points at. `backup` says whether its .tar.zst exists.

    The sizes are of the release folder when open, else of the backup. A release with no settings
    file is still listed, so an old one is visible, but a rollback to it is refused.

    It reads only; nothing on the server changes.

cli.server-info:
  see: [server, permissions]
  text: |
    `shipdeck server-info [DEPLOY]` prints what the server has: Linux and kernel, CPU and cores,
    memory, disk at the deployment folder, uptime, the agent version, and the tools shipdeck
    looked for. It needs the agent, which every connection prepares.

    Use it before a first deploy: it shows whether a runtime the app needs is there, and whether
    disk is short. Memory and disk figures are what the server reports at that moment; they are
    not a measurement.

    The TUI shows the same under Server on the Deploys screen.

cli.work:
  see: [cli.events, releases, troubleshooting]
  text: |
    `shipdeck work [DEPLOY]` shows the live release, the service state, the files an interrupted
    operation left, an activation whose result was never confirmed, and the newest saved events.

    Files left by an interrupted upload or unpack are kept on purpose: they may be all there is to
    inspect. `--cleanup` is the approval to remove them. It removes only the paths this command
    just listed, after re-reading them on the server under the project lock; a path that is not in
    that list is refused. The live release, other releases and backups are never removed.

    In the TUI, `x` on a deploy asks for the same approval.

cli.events:
  see: [cli.work, releases]
  text: |
    `shipdeck events [DEPLOY] --after N --limit M` prints the numbered events the server saved,
    oldest first. Each line is `#sequence time operation kind detail`.

    Events are saved on the server, in /var/lib/shipdeck/users/<ssh user>/state.db, so they
    survive a lost connection. Build, upload, unpack, setup, backup, switch, restart, health and
    the outcome each record one. `--after` follows on from the last sequence you saw; `--limit`
    caps one page at 1000.

    Event recording is best effort: a deploy never fails because an event could not be saved. A
    warning in the log says so when it happens.

cli.init:
  see: [presets, quickstart, cli.schema]
  text: |
    `shipdeck init <NAME> [--preset P] [--manager systemd|pm2] [--host H] [--user U]
    [--project PATH]` writes a root file, a deploy file, an empty .env and a .gitignore in the
    folder you run it in.

    It asks for what the flags leave out, when there is a terminal to ask in; without one, name,
    preset and host are required. The preset sets the build command, what ships, and the default
    start (see presets). The manager chooses the process block: `systemd: {}` or `pm2: {}`.

    What it writes is checked as a launch would check it before anything is written, so init never
    writes a config shipdeck would refuse. An existing root file is never replaced.

    Then: fill in the deploy file, `shipdeck tree <NAME>` to see what ships, and
    `shipdeck deploy <NAME>`.

cli.schema:
  see: [config, cli.init]
  text: |
    `shipdeck --schema` prints the JSON Schema of the root file and the deploy file. The same
    file is published at each release:
      https://raw.githubusercontent.com/Naz-Ovh/shipdeck/v<version>/docs/schema/deploy.schema.json
    The first line `init` writes points at it, so editors complete keys, show a field's meaning,
    and mark a wrong type as you type:
      # yaml-language-server: $schema=https://raw.githubusercontent.com/.../deploy.schema.json
    VS Code's YAML extension, Neovim with yaml-language-server, Zed and the JetBrains IDEs read
    that line. The schema is generated from shipdeck's own types, so it cannot drift from the
    code; a test fails when the published file is out of date.

cli.man:
  see: [config, cli]
  text: |
    `shipdeck man` is this manual, built into the binary. It reads no file and needs no network.
      shipdeck man index                  every topic, by section
      shipdeck man configs                every config property, as a tree
      shipdeck man details <KEY>...       one or more topics, or properties, in full
    Keys can be written apart or comma-separated: `man details steps, release.steps.health.url`.
    A property is named by its path, such as `apps.files` or `release.steps.health.timeout_secs`.
    A block prints what is inside it. An unknown key prints nothing and suggests the close ones.

exit-codes:
  see: [cli.deploy, rollback, agents]
  text: |
    What a headless command's exit code means. Scripts depend on these: they are added to, never
    renumbered.
      0   success: the release is live
      1   failed before anything live changed, a config or connection problem, or a refused
          operation (including another operation already running on the project)
      2   the command line was wrong; nothing ran
      3   the new release failed after the switch and the previous one is live again
      4   the new release failed after the switch and was kept live, as you chose
      5   the new release failed and putting the previous one back failed too; inspect the server
      6   nothing changed since the live release; nothing was deployed
      130 interrupted with Ctrl-C twice

login:
  see: [hosts, shell-env, permissions]
  text: |
    shipdeck logs in with SSH, in this order:
      0. --passwordless, no password or key, for a server that allows it (the SSH "none" login)
      1. --key-file PATH, an unencrypted private key file (an encrypted one asks for its passphrase)
      2. --key-text TEXT, a key's text, such as a CI secret (it shows in `ps`)
      3. --password PASSWORD (it lands in shell history)
      4. SHIPDECK_SSH_KEY, a key's text
      5. SHIPDECK_PASSWORD, a password
      6. the IdentityFile of the host's ~/.ssh/config entry
      7. in the TUI, a password asked once per connection
    Headless commands never ask: without any of the above they use the ~/.ssh/config key and then
    fail with a clear message. SHIPDECK_KEY_PASSPHRASE unlocks an encrypted key without asking.
    SHIPDECK_SSH_KEY, SHIPDECK_PASSWORD, SHIPDECK_KEY_PASSPHRASE and SHIPDECK_SUDO_PASSWORD
    can also come from the .env file (see env-file). --password, --key-text and --key-file have
    no short form: a password typed on the command line lands in your shell history.

    The login is never in a config file. One connection per user@host:port is opened and reused
    for every command, upload and release on that server, and closed when the app exits.
    shipdeck does not use your ssh agent.

env-file:
  see: [login, hosts]
  text: |
    shipdeck reads `.env` in the project folder (after -C) when it exists. `-E FILE` or
    `--env-file FILE` reads that file instead; a relative path starts from the project folder, as
    for -c, and a named file that is missing is an error. Only one file is read. The format is
    NAME=value lines, `#` comments and quoted values.
    The values are for shipdeck only. They fill `${NAME}` in a deploy, SHIPDECK_SSH_HOST,
    SHIPDECK_SSH_PORT, SHIPDECK_SSH_USER, SHIPDECK_PASSWORD, SHIPDECK_SSH_KEY,
    SHIPDECK_KEY_PASSPHRASE and SHIPDECK_SUDO_PASSWORD. A variable set in the real environment
    wins over .env (an empty one counts as not set). Your `local` and `server` commands do not
    get .env values. The file is never uploaded unless `files` lists it.

hosts:
  see: [login, shell-env, env-file]
  text: |
    `server.ssh.host` is an address or an alias from ~/.ssh/config. An alias brings its HostName,
    Port, User and IdentityFile; values written in the deploy file win.

    Three ways give host, port and user without writing them in the file:
      1. An alias from ~/.ssh/config as `host`. Each PC maps the alias to its own server.
      2. `${NAME}` in `server.ssh.host`, `port` or `user`. The variable comes from your shell, or
         from .env. It works only in these three fields; elsewhere `${...}` is plain text. A
         name is letters, digits and `_`, and does not start with a digit. Text may surround it:
         `deploy-${TEAM}`. A variable that is not set, or is empty, is an error that names the
         variable, the field and the deploy. It stops only a run that uses that deploy; the TUI
         shows such a deploy as unavailable, with the reason, and the others work. After the
         replacement, `port` must be 1 to 65535.
         In flow-style YAML (`{ ... }`) write the value in quotes: `host: '${NAME}'`.
      3. Flags `-H/--host`, `-P/--port`, `-U/--user`, or the variables SHIPDECK_SSH_HOST,
         SHIPDECK_SSH_PORT, SHIPDECK_SSH_USER, for a run with exactly one deploy.
    The order is: flag, then SHIPDECK_SSH_* variable, then the file. A file value is read only
    when nothing above it is set, so a missing `${NAME}` is no error when `-H` replaces it. With
    more than one deploy (the TUI, or `deploy a b`) the flags and SHIPDECK_SSH_* variables are an
    error; use way 1 or 2. When a value is not from the file, the output says so, for example
    `host from --host`. `-H shop-prod` reads ~/.ssh/config like `host: shop-prod` does.
    `server.dir` always comes from the file. {{HOST}} and the release's .shipdeck/settings.json
    hold the final value.

    Aliases that use ProxyJump or ProxyCommand are refused with their name: shipdeck cannot
    follow them yet. Put the server's own address in `server.ssh.host` instead.

    Host keys are checked against ~/.ssh/known_hosts. An unknown key stops the connection and
    prints its fingerprint; if it is right, `--trust-new-host` (or `y` in the TUI) records it. A
    changed key for a known host is always refused, and shipdeck never continues past it.

    The connection must be able to become root: the account is root, or it has password-free
    sudo. See permissions for the exact rights.

shell-env:
  see: [hosts, config.commands, pm2]
  text: |
    Server commands get the environment a login shell has, so PATH includes nvm, pyenv, cargo and
    the like. Once per connection shipdeck starts the login shell, keeps the variables it exports,
    and runs every later command after them.

    Turn it off per server with `server.ssh.shell_env: false`, or for a whole run with
    --no-shell-env. Then commands run with the environment the SSH session starts with, and a
    program installed under a home folder may not be found.

    A startup file that prints while it loads is harmless here: shipdeck captures only the
    exported variables. A startup file that takes long is bounded; the log says when it gave up
    and commands then run without it.

    PM2 is found through this PATH. With shell_env false, `pm2` must be on the default PATH, or
    the preflight check fails with the name it looked for.

config:
  see: [config.files, config.commands, config.variables, config.problems, config.template]
  text: |
    Two files make a deploy.

    The root file is shipdeck.yaml or .shipdeck in the project folder, exactly those two names;
    shipdeck.yml is not read, and having both is an error. -c names another one. It holds
    `root: true` and the deploys by name:
      root: true
      deploys:
        production: scripts/deploy/production.yaml
        staging: scripts/deploy/staging.yaml
    Each value is a deploy file's path on your PC, or the deploy written in place as a map. A
    deploy written in place follows every rule of a deploy file: the same keys and the same
    checks, its problems point at their line in the root file, and its `./x` paths and
    `{{CONFIG}}` start from the root file's folder.

    The deploy file is one whole deploy: `name`, `server`, `release` and `apps`. It can live
    anywhere, under any name, and needs no root file when you name it with `-c` or as a <DEPLOY>
    argument ending in .yaml or .yml.

    Paths on your PC, in either file, take one of three forms:
      /opt/x        absolute
      apps/x        from the project folder, the one you run shipdeck in
      ./x  ../x     from the config file's own folder
    That covers `deploys`, `source`, `files`, `binary`, `version_from` and
    `process.systemd.template`. An `exclude` pattern matches the path from the project folder.

    Paths in the release are different: `to`, `nginx.root`, `env_file`, `shared`, `start` and
    `pm2.ecosystem` are on the server, inside a release. They never point at your PC.

    Two levels, and nothing is copied: `release:` runs or applies once for the whole deploy;
    `apps.<app>:` is that app only. Apps run in name order everywhere.

    Every value is checked when the file is read, in three passes, so that every problem in every
    file is reported at once:
    1. YAML, keeping each key's line and column. One document per file; a key written twice in the
       same map is refused.
    2. The shape, against the JSON Schema: unknown keys (with "did you mean"), wrong types, a
       step that does not take what is written there.
    3. The values: required and refused keys per kind of app, one manager per process, reserved
       properties, names, release paths, and every `{{NAME}}` in its place.
    Any problem stops shipdeck with exit code 1 before it logs in anywhere (see config.problems).

    YAML notes:
    - `key:` with nothing after it means "use the default".
    - Quote a value that starts with `{`, `[`, `!` or `*`: YAML would read a map, a list, a tag or
      an alias. shipdeck says so and shows the quoted form.
    - A command is one string or a list. Quote a value that holds `: `, or YAML reads it as a map.
    - Anchors and aliases work within one file.
    - Settings are read once per run; edits while the TUI is open apply on its next start.

config.files:
  see: [step.build, step.upload, step.backup]
  text: |
    A file entry is a path, or a path and where it lands:
      files:
        - package.json                          # release: current/package.json
        - packages                              # the whole folder
        - { path: ./prod/config.json, to: config/prod.json }

    In `release.files`, every path keeps its place from the project folder: `packages/a/x.js`
    lands at current/packages/a/x.js. In `apps.<app>.files`, a project path keeps its place inside
    the app's `source`, and lands in apps/<app>/: with `source: services/api`, the entry
    `services/api/dist` lands at current/apps/api/dist. `to` is relative to the release root, or
    to the app folder in an app.

    A binary takes the same two forms, and never needs `to`, because its file name is its
    place: `binary: target/release/api`, or `binary: { path: target/release/api, to: bin/api }`.

    A file with no place of its own needs `to`. Refused without it:
    - a `./`, `../` or absolute path in release.files;
    - an app file outside the app's `source`.
    `to` cannot place a pattern; it takes one file or one folder.

    `exclude` patterns are matched against the path from the project folder, and use the same
    syntax as everywhere else:
      dist                 the folder and everything in it (or a file of that name)
      *.js, file?.txt      names inside one folder; `*` and `?` never cross a `/`
      **/*.map             at any depth, the top included
      src/*.{js,ts}        one of several; braces nest: {lib,bin}/**
      "!pattern"           not this one
    `.git` is never shipped. A file whose name starts with .env gets mode 0600; other files keep
    their mode (0644 from Windows). Symbolic links stay links; a link named by an exact path in
    `files` is followed instead, so `dist -> build/out` ships the folder.

    Every include pattern must find something, so a missing build output is caught before anything
    is uploaded. The error names it as `(not found)` or `(matched nothing)`, and `shipdeck tree`
    prints the same list.

    Two files for one path are an error that names both; nothing is overwritten silently. Nothing
    may land in `.shipdeck/` or in a shared folder.

config.commands:
  see: [config.variables, steps, step.setup]
  text: |
    Every step takes `local` and `server`, at release and app level:
      release:
        steps:
          build:
            local: npm run build
      apps:
        api:
          steps:
            setup:
              server: [npm ci --omit=dev, node --check dist/main.js]

    A command is one line run with `sh`, or one runner and its code:
      setup:
        server:
          - npm ci --omit=dev                 # sh
          - bash: set -o pipefail; npm run migrate | tee migrate.log
          - node: |
              const pkg = require("./package.json");
              if (!pkg.version) process.exit(1);
          - python3: import sys; assert sys.version_info >= (3, 11)
    The runners are sh (the default), bash, zsh, node and python3. Each runs as `sh -c '<code>'`,
    `bash -c`, `zsh -c`, `node -e` and `python3 -c`; the code goes to it as written, apart from
    the placeholders. Any other key, or a map with two keys, is refused with a hint: a value with
    an unquoted `: ` reads as a map, so put the whole command in quotes.

    Order: the server side runs before the local one; release commands before each app's; apps in
    name order. Then shipdeck does the step's own work. If a command fails, the step fails and
    shipdeck's work does not happen.

    Where local commands run: the project folder for release commands, the app's `source` for app
    commands. With `sh -c` (on Windows, Git for Windows' sh.exe; see install), stdin closed, and
    output streamed to the log. They inherit shipdeck's environment plus the SHIPDECK_* variables,
    and CARGO_TERM_PROGRESS_WHEN=always, so cargo's progress bar becomes the step's progress.

    Where server commands run:
      step                          release server      app server
      preflight, build, upload,     dir                 dir
        rollback, failed
      setup, backup, switch         releases/<id>       releases/<id>/apps/<app>
      restart, nginx, health, done  current             current/apps/<app>
    Before upload there is no new release folder, so the first steps use dir. switch commands run
    in the new release before current points at it. rollback and failed use dir, because the
    folder they would use may be the broken one.

    Each server command is its own script: load the login shell's exports (see shell-env),
    `set -e`, cd to the step's folder, export the app's `env`, load the env file, export the
    SHIPDECK_* variables, then your line. A non-zero exit fails the step with the code. Your
    commands are shell by design: shipdeck adds no sudo to them.

    Every runner used in a `local` command must be on your PC, and every runner in a `server`
    command on the server. Preflight checks them from the config, without looking inside a
    command, together with `release.steps.preflight.requires`. A missing one names the runner, the
    step and the app. A program called inside a command, such as `npm` in an `sh` command, is not
    found that way; list it in `requires`.

config.variables:
  see: [config.commands, step.failed, config]
  text: |
    Every placeholder is also an environment variable: `{{CURRENT}}` is SHIPDECK_CURRENT,
    `{{APP_SHARED}}` is SHIPDECK_APP_SHARED. Four values change while a deploy runs, so they exist
    only as variables:
      SHIPDECK_ACTION      deploy, or rollback
      SHIPDECK_STEP        the step running; in failed and rollback, the step that failed
      SHIPDECK_PREVIOUS    the release that was live before
      SHIPDECK_ERROR       the error, in failed
    A script file cannot see placeholders, so this is how it learns where it is.

    The placeholders, and where each has a value:
      {{ROOT}}        /opt/shop, the server dir                  everywhere
      {{CURRENT}}     /opt/shop/current                          everywhere
      {{SHARED}}      /opt/shop/shared                           everywhere
      {{BACKUPS}}     /opt/shop/backups                          everywhere
      {{RELEASE}}     /opt/shop/releases/<id>                    from build on
      {{RELEASE_ID}}  v1.4.0-ab12cd3-20261010.120000             from build on
      {{VERSION}}     1.4.0                                      from build on
      {{NAME}}        shop                                       everywhere
      {{HOST}}        prod, server.ssh.host as written           everywhere
      {{PROJECT}}     the project folder on your PC               everywhere
      {{CONFIG}}      the deploy file's folder on your PC         everywhere
      {{APP}}         api                                        inside an app
      {{APP_CURRENT}} /opt/shop/current/apps/api                 inside an app
      {{APP_RELEASE}} /opt/shop/releases/<id>/apps/api           inside an app, from build on
      {{APP_SHARED}}  /opt/shop/shared/apps/api                   inside an app
      {{SOURCE}}      the app's source folder on your PC          inside an app
      {{PROCESS}}     shop-api                                    inside a process app
    A name used where it has no value is an error that says so, such as `{{APP}}` in `release:` or
    `{{RELEASE}}` in preflight. An unknown name lists the known ones.

    Placeholders are `{{`, capital letters, digits and `_`, then `}}`; spaces inside are allowed,
    so `{{ ROOT }}` is `{{ROOT}}`. Other text with braces, such as JavaScript or Python, is left
    alone. shipdeck replaces the text as it is and adds no quotes; a path may hold spaces, so
    quote it: `cd "{{PROJECT}}"`.

    Server commands also get, in this order, so later wins: the login shell's exports, the app's
    `env`, the app's env file read the way systemd reads it, then the SHIPDECK_* variables. Local
    commands get none of the app's environment.

config.problems:
  see: [config, troubleshooting, config.variables]
  text: |
    Every config file is read before anything runs. If any has a mistake, shipdeck prints every
    problem in every file at once, sorted by line, and stops with exit code 1 without logging in
    anywhere:
      ✘ shipdeck did not read the deploy: 1 shipdeck file has 2 problems

      deploy/production.yaml
        error: `process` and `static` cannot both be set
          ┌─ deploy/production.yaml:24:5
       24 │     static: true
          │     ^^^^^^ pick one
          = help: remove `static` for a process, or `process` for a static site
    Each problem has a message, file:line:column, the line with a caret and a label, and usually a
    help line with the fix. On a terminal it is in colour, unless NO_COLOR is set.

    Common ones, and the fix:
    - unknown key `apps.web.proces`: a typo; the help offers "did you mean `process`?".
    - `server.dir` is missing: name, server.ssh.host, server.dir and apps are required.
    - one of `process` or `static: true` is needed: say what the app is.
    - a process needs one manager: "systemd", "pm2" or "oxmgr"; there is no default manager.
    - shipdeck writes `ExecStart` itself: that comes from `process.start`. Likewise
      WorkingDirectory, User, Environment and EnvironmentFile, and PM2's own keys.
    - `systemd.instances` is planned, not supported yet.
    - ... reads as a YAML tag: a value starting with `!` needs quotes, as in "!src/old".
    - ... reads as a command map: a command with `: ` needs quotes, or use a runner map.
    - has Windows line endings (CRLF): save with LF; `*.yaml text eol=lf` keeps it that way.
    - `{{APP}}` has no value here: it is only valid inside an app.
    - `{{RELEASE}}` has no value here: the release is named at the start of build.
    - ./x is outside the project folder, so it needs `to`: give it a place in the release.
    - .shipdeck belongs to shipdeck: nothing may land there.
    - a static app refuses binary, shared, steps.setup and steps.backup.include.
    - a process app with `nginx` needs `proxy_pass`; a static app needs root and index.
    - `tls` is `none` or a map with `provider` and `email`.
    - the folder has both shipdeck.yaml and .shipdeck: keep one.
    - no root file here; expected shipdeck.yaml or .shipdeck: run shipdeck in that folder, -C it,
      or name a root file with -c.

config.template:
  see: [systemd, pm2]
  text: |
    process.systemd.template names a whole unit file on your PC; shipdeck never looks for one by
    itself. Without it, the built-in unit is used and `process.systemd.options` changes it.

    The template is rendered into .shipdeck/<process>.service in every release, which the switch
    installs. It is rendered once at preflight too, so an unknown placeholder, an unclosed `{{`,
    or a name with no value stops the deploy there, before anything is built, naming the known
    ones. Spaces inside the braces are fine: `{{ user }}`.

    It uses the same placeholders as any string (see config.variables). The ones that matter in a
    unit:
      {{APP_CURRENT}}   the app's live folder; the default start runs there
      {{CURRENT}}       the live release folder
      {{RELEASE}}       the new release's folder
      {{APP_RELEASE}}   the app's folder in the new release
      {{PROCESS}}       the process name
      {{VERSION}}       the version
    The built-in unit uses {{APP_CURRENT}} for WorkingDirectory and the app's `env` for its
    Environment lines. `{{RELEASE}}` is the release folder, not its id, so a label in the unit
    reads SHIPDECK_RELEASE={{RELEASE_ID}}.

    Keep WorkingDirectory and every path under {{CURRENT}}: a rollback only moves current, which
    is what makes the unit right for every release. The template is part of the release's
    fingerprint, so editing it counts as a change.

    The usual reason for one is a runtime installed under /home, such as Node from nvm: the
    built-in unit has ProtectHome=true, and preflight refuses such a program. A template without
    ProtectHome works; installing the runtime system-wide, or using PM2, is the better fix.

steps:
  see: [config.commands, step.preflight, rollback, exit-codes]
  text: |
    Twelve steps, in order. Each is your commands first (the server's, then the local ones, the
    release's then each app's), then shipdeck's own work.

      #   step        when                          shipdeck's work after your commands
      1   preflight   every deploy                  checks the connection, requires, runners
      2   build       every deploy                  names the release, collects and hashes files
      3   upload      every deploy                  packs, sends, unpacks, links shared folders
      4   setup       every deploy                  nothing; the step is your commands
      5   backup      every deploy                  writes backups/<id>.tar.zst
      6   switch      every deploy                  points current at the new release
      7   restart     every deploy                  restarts each process
      8   nginx       every deploy                  nothing yet: nginx is parsed, not built
      9   health      every deploy                  fetches health.url
      10  done        every deploy                  removes old releases beyond backup.keep
      11  rollback    a failure in 6-9, or by hand puts an older release back
      12  failed      any failure                   nothing; the step is your commands

    The release is named at the start of build, before build's commands, so {{RELEASE}},
    {{RELEASE_ID}} and {{VERSION}} work from build on.

    A deploy: preflight, build, upload, setup, backup, switch, restart, nginx, health, done. A
    failure in switch, restart, nginx or health runs rollback, then failed; a failure anywhere
    else runs failed only. A failure before switch removes the new release; a failure in done is
    only a warning and the release stays live.

    What each step takes: preflight requires (release), build version_from (release), backup
    keep (release) plus include and exclude, health timeout_secs (release) and url (app), rollback
    mode, ask_secs and keep_failed (release). Every step takes `local` and `server`.

step.preflight:
  see: [step.build, permissions, config.commands]
  text: |
    What must be true before anything is built or sent. shipdeck checks, in order:
    - the project folder and every app's source folder exist on your PC;
    - every `process.systemd.template` named exists;
    - every runner used in a `local` command exists on your PC;
    - a deploy whose config has `nginx:` or an `oxmgr:` process stops here: "nginx management is
      not built yet" or "oxmgr is not built yet";
    - it connects, and takes the project lock;
    - the server has the tools shipdeck unpacks and checks releases with: tar, zstd and
      sha256sum (it says which package to install);
    - `requires`, every runner used in a `server` command, and each app's start program are on
      the server; HTTP health checks need curl or wget;
    - the sudo rights it will need are granted, without a password;
    - the deployment folder exists and is writable, and there is disk for a release;
    - with PM2, no systemd unit of the same process name is still running.

    Then your commands run: the server's in dir, then the local ones in the project folder and in
    each app's source.

    A failure here stops the run before anything was built, and the exit code is 1. Nothing on the
    server changes except the deployment folder, created on a first deploy.

step.build:
  see: [step.preflight, config.files, releases]
  text: |
    Names the release, runs your build, then collects the files.

    The name is `<version>-<git>[-dirty]-<UTC build time>`, as in v1.4.0-ab12cd3-20261015.120000.
    The version comes from `release.steps.build.version_from` when set: a Cargo.toml,
    package.json, pyproject.toml, or any file whose first line is the version. Without it, the
    first of those found in the project folder is used, and then the latest git tag. The git part
    is the short commit, `nogit` outside a repository, and `-dirty` when tracked files changed.

    Your commands run in the project folder (release) and each app's source (app), after the
    release is named. Then:
    - every file entry is collected, and a pattern that matches nothing fails the step;
    - every file is hashed, so the server can keep files the live release already has;
    - an app's binary is checked against the server's CPU and glibc;
    - the release's content fingerprint is compared with the live one. When they are equal, the
      deploy stops with exit code 6 unless the app answers otherwise.

    Nothing on the server changes here.

step.upload:
  see: [step.build, step.setup, delta]
  text: |
    Packs the collected files into one tar.zst, sends it, unpacks it into releases/<id>, checks
    every file against its hash, and links the shared folders.

    A file whose hash the live release already has stays out of the archive; the server copies it
    from current instead. The copied files are checked like the rest, and a mismatch re-sends the
    whole release once.

    Shared folders are linked at the same step: `release.shared: [storage]` makes
    releases/<id>/storage a link to shared/storage, and `apps.api.shared: [uploads]` makes
    releases/<id>/apps/api/uploads a link to shared/apps/api/uploads. The data is created on the
    first deploy and kept from then on; it is never in a backup.

    A failure here removes nothing: the unfinished release files are kept so you can look at
    them (see cli.work), and the live release never stopped serving.

step.setup:
  see: [step.upload, step.backup, rollback]
  text: |
    Runs your commands in the new release while the old one is still live: the release's
    `setup.server` first, then each app's, in app name order.

    That is where `npm ci --omit=dev`, a migration, a compile step, or a `node --check` belongs.
    A static app has no setup, and `steps.setup` on one is refused when the file is read.

    There is no separate check step: a check is the last command in `setup.server`, and a failure
    fails the step with its exit code. A failure removes nothing and switches nothing; the new
    release folder stays for inspection, and the live release keeps serving.

    What setup makes is not shipped next time and not kept in a backup by default, because setup
    can make it again. Add a path to `steps.backup.include` when it cannot.

step.backup:
  see: [step.setup, step.done, rollback, releases]
  text: |
    Packs what the release holds into backups/<id>.tar.zst, then the folder can go later.

    A backup always holds what was uploaded: every file from `files`, plus `.shipdeck/`. There is
    no switch to turn that off. Two lists change it:
    - `include` adds paths that setup made on the server and cannot make again;
    - `exclude` leaves out uploaded paths, such as big files you can do without on a rollback.
    In the release scope both are in the release root; in an app they are in the app folder.
    Shared folders are never in a backup.

    Nothing is made when `keep.compressed` is 0. A failure here keeps the release folder and stops
    before the switch, so the live release is untouched.

step.switch:
  see: [step.restart, step.health, rollback]
  text: |
    Points `current` at the new release in one rename, so it is never missing or half-written, and
    installs each systemd unit from .shipdeck/ in the new release. PM2 reads its file from
    current at restart instead.

    It runs your commands in the new release before the switch, so current still points at the old
    one while they run. After the switch, current is the new release.

    The first failure that needs a rollback starts here: a failure in this step (or later) puts
    the previous release back according to `release.steps.rollback.mode`.

step.restart:
  see: [step.switch, systemd, pm2]
  text: |
    Restarts each process on the new release: `systemctl restart` for systemd, `pm2 startOrReload`
    then `pm2 save` for PM2. A static app has nothing to restart; its files were made live by the
    switch, and its restart commands still run.

    This is the only downtime of a deploy, about 1-2 seconds for most apps.

    A process that was removed, or that changed manager or name since the live release, is
    stopped and retired here, so two processes never hold one port.

step.nginx:
  see: [config, step.health]
  text: |
    Not built yet. A deploy whose config has `nginx:` on any app stops at preflight with "nginx
    management is not built yet"; nothing reaching this step has an nginx app.

    The step exists so that this work has its place later: write the app's nginx config, check it
    with nginx -t, reload nginx, and get a missing certificate. Its commands run like any other
    step's, so a release can prepare nginx state itself today.

    Until it is built, a static app is shipped and switched; serving it is up to your own web
    server pointed at {{APP_CURRENT}}/dist.

step.health:
  see: [step.restart, step.done, rollback]
  text: |
    Each try runs the commands, then fetches the app's `health.url` on the server. A failure in
    either starts the next try, until `release.steps.health.timeout_secs`. Apps are checked first,
    in name order; the release's own commands run once every app is healthy.

    The URL is fetched with curl or wget on the server and must answer 2xx. It is the app's
    address as the server sees it, such as http://127.0.0.1:3000/, not a public address that may
    go through a proxy.

    A failure here, like one in switch or restart, puts the previous release back according to
    `release.steps.rollback.mode`. That is why a health check should fail fast for a broken app:
    the rollback cannot start until it gives up.

step.done:
  see: [step.health, releases, rollback]
  text: |
    Removes old releases beyond `release.steps.backup.keep`: the open release closes, and an older
    backup goes, as the keep counts say. Then your done commands run in current, and in each app's
    folder.

    It is the place for a cache warm-up, a notification, or an entry in a log. A failure here is
    only a warning: the new release is live and stays live.

    A rollback runs done commands too, from the restored release's own settings.

step.rollback:
  see: [rollback, step.failed, step.setup]
  text: |
    Puts an older release back. It runs after a failure in switch, restart, nginx or health, or
    when you ask for it by hand.

    Your commands run first, from the deploy file you started with: rollback.server, then
    rollback.local, in dir. Then the action: unpack the release if it only has a backup, link its
    shared folders, run its setup.server, switch to it, restart, nginx, health with its own
    checks, and done. A rollback after a failure then runs failed.

    The commands that come from the restored release are setup.server, health.server and done,
    read from its .shipdeck/settings.json, so they match its files.

    A failure in the rollback itself ends the run as "rollback failed" (exit code 5) and failed
    still runs. See rollback for the settings and the exact table of which commands run.

step.failed:
  see: [step.rollback, config.variables, rollback]
  text: |
    Runs after any failure, last. `failed.server` runs only when the server can be reached; when it
    cannot, the log says the server commands were skipped and the local ones still run. The step
    is your commands; shipdeck's work here is nothing.

    It sees SHIPDECK_STEP (the step that failed), SHIPDECK_ERROR (the first line of the error) and
    SHIPDECK_PREVIOUS (the release that was live before). That is enough to shout at a chat
    channel, or to write one line in a file.

    Its own failure is only a warning: the run's outcome is still the original failure. A manual
    rollback runs failed only if the rollback itself fails.

releases:
  see: [rollback, step.backup, cli.releases]
  text: |
    Every deploy is kept on the server under `server.dir`:
      current -> releases/<id>      the live release, one symlink
      releases/<id>/                one folder per release, still open
      backups/<id>.tar.zst          one archive per release, once its folder went
      shared/                       data kept across releases
    Your files land exactly as the config says: release files at their path from the project
    folder, app files under apps/<app>/, a binary by its file name or its `to`, mode 0755.
    Shipdeck's own files live in each release's .shipdeck/:
      release.json            always; what was deployed, by whom and when
      settings.json           always; the resolved deploy, for rollback
      <process>.service       a systemd app
      <process>.pm2.json      a PM2 app without its own ecosystem file
      oxfile.toml             any oxmgr app; none is written yet
      nginx/<name>-<app>.conf any app with nginx; none is written yet
    The rest of the release is only your files, so `tree` reads as a list of them.

    Release ids sort by build time, never by text: v0.10.0 counts as newer than v0.9.0. A folder
    shipdeck did not name is never touched, listed, or rolled back to.

    What stays: `release.steps.backup.keep.open` releases stay unpacked, counting the live one,
    ready to switch to; then `keep.compressed` stay only as their backup; everything older goes.
    An open release is untouched since its own setup, so a rollback to one runs no setup.

    The layout is a contract with servers already deployed to: it is added to, never rearranged.

delta:
  see: [step.upload, step.build]
  text: |
    Only what the live release lacks is sent. The server hashes the files of current now; a file
    whose hash the new release also has is copied from current instead of travelling.

    Nothing stored is trusted: the live files are hashed on the server at deploy time, so a file
    edited on the server is not treated as unchanged. A copy that does not match its hash re-sends
    the whole release once, and the log says so.

    The saving is largest for a small change to a big tree. A first deploy sends everything: there
    is nothing to copy from.

unchanged:
  see: [step.build, cli.deploy, exit-codes]
  text: |
    A release whose content fingerprint equals the live release's is the same deploy. The
    fingerprint covers every shipped file with its mode and hash, each app's process file, and the
    settings file; the release name and the time are not in it.

    Headless, such a deploy stops with exit code 6 unless `--allow-unchanged` is given. In the TUI
    it asks, and no answer means nothing is deployed. Nothing on the server changes either way.

    A live release from before fingerprints have none, so the next deploy is always a change.

rollback:
  see: [step.rollback, step.failed, cli.rollback, releases]
  text: |
    A rollback puts an older release back. It happens two ways: automatically, when switch,
    restart, nginx or health fails, or by hand with `shipdeck rollback`.

    Settings live in `release.steps.rollback`:
      mode: ask          ask, then roll back on its own after ask_secs (the default)
      mode: auto         roll back at once
      mode: off          never roll back on its own; the failed release stays live
      ask_secs: 30       how long ask waits
      keep_failed: false keep the failed release folder instead of removing it

    What runs, exactly:
    1. your commands: rollback.server, then rollback.local;
    2. the action: from a backup only, unpack it, link its shared folders and run its
       setup.server; then switch back, restart, nginx, health with the restored release's own
       checks, and done;
    3. after an automatic rollback: failed.

    Which commands come from where: setup.server, health.server and done are the restored
    release's, read from its .shipdeck/settings.json, so they match its files. rollback and failed
    are from the deploy file you ran. When rollback.server runs, current still points at the
    release being replaced, and SHIPDECK_PREVIOUS names the release being put back.

    Notes:
    - setup.server runs again only when the release came back from a backup; an open release
      keeps what its setup made.
    - A rollback checks the restored release with its own health checks; a failure there means
      the rollback failed, and failed still runs.
    - When nothing was live before, there is nothing to roll back to: the failed release stays and
      the run ends as failed.
    - A manual rollback runs failed only if the rollback itself fails.

service-control:
  see: [systemd, pm2, cli.tui]
  text: |
    The service can be stopped, started and restarted outside a deploy, from the TUI command line:
      :stop, :start, :restart    act on the deploy's processes (they ask first, except :start)
      :logs                      follows the process log of each app
    A multi-app deploy acts on every process in it; logs are labelled with the app name.

    shipdeck takes the project lock for a control change, so it cannot overlap a deploy. With
    systemd, stop, start, restart and the log run as root through the agent (see permissions).

    A static app has no process to control and no process log; nginx keeps its own in
    /var/log/nginx.

systemd:
  see: [config.template, pm2, permissions, step.restart]
  text: |
    The common manager. shipdeck writes one unit per process into the release's .shipdeck/,
    installs it to /etc/systemd/system/<process>.service, reloads systemd and enables it at boot.
    The process name is `process.name`, or `<name>-<app>`.

    The built-in unit is:
      [Unit]
      Description=<name> <app> (<version>)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      User=<user>
      WorkingDirectory=<dir>/current/apps/<app>
      ExecStart=<start>
      Environment=SHIPDECK_RELEASE=<release folder>
      EnvironmentFile=<app folder>/<env_file>   when set
      Environment="KEY=value"                   one per process.env entry
      Restart=always
      RestartSec=2
      KillSignal=SIGTERM
      TimeoutStopSec=30
      LimitNOFILE=65535
      NoNewPrivileges=true
      ProtectSystem=strict
      ReadWritePaths=<dir>/shared
      ProtectHome=true
      PrivateTmp, PrivateDevices, ProtectKernel*, ProtectControlGroups, RestrictSUIDSGID,
      LockPersonality
      [Install]
      WantedBy=multi-user.target

    Change it two ways:
    - `process.systemd.options`, by section, in systemd's own spelling: a property replaces the
      built-in line of the same name, or is added; a list writes one line per item.
    - `process.systemd.template`, a whole file on your PC (see config.template).
    Shipdeck's own properties are refused in `options`, because they come from other keys: the
    command from `start`, the folder from the app folder, the environment from `env` and
    `env_file`, the user from `systemd.user`.

    The process runs through the current link, so a restart after the switch runs the new release,
    and a rollback only moves the link. `systemd.user` defaults to the SSH user.

    Instances (`systemd.instances`, `{{INSTANCE}}`, `@` in a process name) are planned and refused
    for now; PM2 has `instances` and `exec_mode: cluster` today.

pm2:
  see: [systemd, step.restart, permissions]
  text: |
    PM2 runs the app as the SSH user, without sudo. Choose it with `process.pm2`; the manager is
    the block, so there is no `manager:` key.

    shipdeck writes .shipdeck/<process>.pm2.json and reloads the app from it:
      { "apps": [{ "name": "<process>", "cwd": "<dir>/current/apps/<app>",
                   "script": "<script>", "args": [...], "interpreter": "<program>",
                   ...your options }] }
    For a node start, the script is the file and the interpreter is node, so cluster mode works;
    node's own flags go in `options.node_args`. Any other program runs as it is.

    `process.pm2.options` are PM2's own app settings, such as instances, exec_mode and
    max_memory_restart. Shipdeck's own are refused: name, cwd, script, args, interpreter and env,
    because they come from `process.name`, the app folder, `start`, `env` and `env_file`.

    `process.pm2.ecosystem` is your own file, in the app folder, since PM2 reads it on the server.
    It replaces `options`, and `start` is then an error. Ship it with `files`.

    Environment: `process.env` and `env_file` are exported before PM2 is called, which takes them
    with --update-env. Nothing is hidden in the json file.

    Stopping, starting, restarting and the log go through PM2 as the SSH user; no sudo is needed.
    `pm2 save` after a change keeps the app coming back after a reboot.

    oxmgr is the third manager: its block is parsed and checked, and a deploy that uses it stops at
    preflight with "oxmgr is not built yet".

server:
  see: [permissions, cli.server-info, releases]
  text: |
    A Linux server reachable over SSH, nothing else. shipdeck installs no system package. The
    agent is a separate binary in /var/lib/shipdeck/agent, installed on the first connection and
    updated when needed.

    During a deploy it makes, under `server.dir`: releases/, backups/, shared/, and current as a
    symlink. The first deploy creates the folder if the user may, else with sudo, and hands it
    back to the user. Nothing outside `server.dir` changes except /etc/systemd/system for units.

    Disk: a deploy needs room for the archive plus the unpacked release. Preflight refuses under
    100 MiB free and names the size a release needs when it can.

    glibc: a binary app is checked against the server's CPU and glibc. Build against the server's
    glibc, or build static, when they differ; shipdeck says which of the two is wrong.

    `shipdeck server-info` prints Linux, kernel, CPU, memory, disk, uptime, the tools and the
    agent version.

permissions:
  see: [systemd, pm2, server]
  text: |
    Any SSH user may log in, root included. The one need: the user can become root without a
    password. That is the `root` account, or a user with full password-free sudo (NOPASSWD: ALL).

    The reason: shipdeck installs and updates its agent on every server, and the agent does its
    file work as root. A sudo rule limited to some commands is not supported.

    To give a user full password-free sudo, run this as root on the server (here the user is
    `deploy`):
      echo 'deploy ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/deploy
      chmod 0440 /etc/sudoers.d/deploy
      visudo -c

    shipdeck checks this before anything else, with `sudo -n`. A user that fails the check stops
    the run with this text and the same example. Nothing is changed on the server first.

    With PM2 the app runs as the SSH user; the agent still needs root to install itself.

presets:
  see: [cli.init, examples]
  text: |
    What `shipdeck init --preset` writes. Every preset writes a root file, a deploy file, an
    empty .env and a .gitignore, then you fill in the values.

      nodejs    build: npm ci, npm run build; ships dist and the manifests; server runs
                npm ci --omit=dev; start: node dist/main.js; requires npm
      golang    build: CGO_ENABLED=0 go build -o dist/<name>; binary dist/<name>; no setup
      rust      build: cargo build --release; binary target/release/<name>; no setup
      bun       build: bun install then bun build --compile; binary dist/<name>
      dart      build: dart pub get then dart compile exe; binary dist/<name>
      java      build: ./gradlew installDist; ships build/install/<name>; requires java
      kotlin    the same as java
      python    ships the whole project; server makes a virtualenv and installs requirements;
                requires python3; start: .venv/bin/python main.py

    The manager flag writes `systemd: {}` or `pm2: {}`. --host and --user set the server; --project
    points at your source, relative to where you run init.

examples:
  see: [config, presets, recipes, monorepo]
  text: |
    Complete files for every shape live in examples/ in the repository, each with a root file
    and a deploy file:
      node/        a Node.js app with a build and server-side installs
      go/          one static binary, nothing to install on the server
      rust/        a binary built for the server's glibc
      python/      source plus a virtualenv made on the server
      pm2/         PM2 in cluster mode, no sudo
      static/      files shipped and switched; serving is yours
      monorepo/    one release with a process app and a static site
      inline/      a deploy written in the root file itself, beside one in a deploy file

    A small deploy file with a bit of everything:
      name: shop
      server:
        ssh: { host: prod, user: deploy }
        dir: /opt/shop
      release:
        files: [package.json, packages]
        exclude: ["**/node_modules"]
        shared: [storage]
        steps:
          build:
            version_from: package.json
            local: pnpm run build
          backup:
            keep: { open: 5, compressed: 15 }
          rollback:
            mode: auto
      apps:
        api:
          source: services/api
          files: [services/api/dist]
          shared: [uploads]
          process:
            start: node dist/main.js
            env_file: .env
            systemd:
              options:
                Service: { MemoryMax: 1G }
          steps:
            setup:
              server: npm ci --omit=dev
            health:
              url: http://127.0.0.1:3000/

recipes:
  see: [examples, monorepo, config.commands]
  text: |
    A few things people ask for, as they are written.

    Build against the server's glibc (Rust, C, C++):
      release:
        steps:
          build:
            local: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
      apps:
        api:
          binary: target/x86_64-unknown-linux-gnu/release/api
    Preflight checks the binary's glibc against the server's and says which is wrong.

    Migrations on the server, once per release, before it goes live:
      apps:
        api:
          steps:
            setup:
              server: [npm ci --omit=dev, npm run migrate]

    Secrets that stay out of git: put them in a file, ship it with `to`, and name it as the env
    file:
      apps:
        api:
          files:
            - { path: ./prod/.env, to: .env }
          process:
            env_file: .env
    Files whose name starts with .env ship with mode 0600.

    A binary with a place of its own in the app folder:
      apps:
        api:
          binary: { path: target/release/api, to: bin/api }
          process:
            start: ./bin/api        # the default, since a binary with `to` starts there

    A program from a version manager (nvm, pyenv, mise): leave `shell_env` on, and list the
    program in `requires` so preflight finds it.

    CI: run `shipdeck deploy production` with SHIPDECK_SSH_KEY and SHIPDECK_KEY_PASSPHRASE set, and
    read the exit code. `--allow-unchanged` when a rebuild of the same source should still deploy.

    What a release holds, before deploying: `shipdeck tree production --depth 3`.

troubleshooting:
  see: [config.problems, exit-codes, cli.work, permissions]
  text: |
    The messages people hit, and what they mean.

    ✘ no root file here; expected shipdeck.yaml or .shipdeck
      shipdeck reads the root file in the project folder. Run it there, name the folder with -C,
      or name a root file with -c.

    ✘ this folder has both shipdeck.yaml and .shipdeck
      Keep one. shipdeck.yml is not read at all.

    ✘ unknown key `service`
      Config format 2 has no `service`. A process is `apps.<app>.process`, with one of `systemd`,
      `pm2` or `oxmgr` inside. See config for the whole change.

    ✘ nginx management is not built yet
      Any app with `nginx:` stops the deploy at preflight. Remove `nginx:` for now; the files still
      ship and switch, and your own web server can serve them from {{APP_CURRENT}}/dist.

    ✘ oxmgr is not built yet
      The same for an `oxmgr:` process: it is parsed and checked, not run.

    ✘ this release was made before config format 2; deploy again
      A rollback to an old release has no .shipdeck/settings.json, so shipdeck cannot read what
      its setup needs. Deploy that version again with this shipdeck.

    ✘ a deploy or rollback is already running
      shipdeck holds a project lock. Wait for the other run, or inspect it with `shipdeck work`.

    ✘ <user> cannot become root without a password
      shipdeck needs root to install its agent. Use root, or give the user password-free sudo; see
      permissions for the sudoers line.

    ✘ the server has no zstd; install it (apt install zstd, or dnf install zstd)
      Preflight names the package: tar, zstd and sha256sum are how releases are unpacked and
      checked.

    ✘ <user> cannot find node on the server
      The program is not on the PATH the server commands see. Install it system-wide, or list it
      in `requires` and fix the PATH; with a version manager, keep `shell_env` on.

    ✘ <tool> is at /home/..., but the built-in unit hides home folders
      The built-in unit has ProtectHome=true. Install the runtime system-wide, use PM2, or write
      your own `process.systemd.template` without ProtectHome.

    ✘ the binary is built for aarch64, but the server is x86_64
      Build for the server's CPU; preflight compares the two.

    ✘ the health URL did not answer
      The URL is fetched from the server, so it must be reachable there. Check the port and that
      the app listens on 127.0.0.1 or 0.0.0.0.

    ✘ nothing changed since <release> (exit code 6)
      The release's content equals the live one. Nothing was deployed. Use --allow-unchanged to
      deploy a duplicate anyway.

    ✘ unfinished release files were kept for inspection
      An upload or unpack failed. Look with `shipdeck work`, then remove them with `--cleanup`.

    A deploy that ends as "rollback failed" (exit code 5) means the server may be between two
    releases. Do not guess: `shipdeck work` shows the live release and the service state, and the
    log says how far it got.

monorepo:
  see: [examples, steps, rollback]
  text: |
    One deploy can hold several apps. They share one release, one switch and one health gate, and
    each app has its own folder in it: apps/<app>.

      name: product
      server: { ssh: { host: prod }, dir: /opt/product }
      release:
        files: [package.json, packages]      # shared by every app
      apps:
        api:
          source: services/api
          files: [services/api/dist]
          process: { start: node dist/main.js, systemd: {} }
        admin:
          source: apps/admin
          files: [apps/admin/dist]
          static: true

    Rules that keep it predictable:
    - Apps run in name order, everywhere: commands, restarts and health checks.
    - Nothing is copied from `release` into an app. A setting that applies to one app is written
      under that app.
    - Process names default to `<name>-<app>`, so two apps in one deploy never share a unit.
    - A static app in a mixed deploy is skipped by restart; the others still restart.

    Deploying only one app is not a mode: it is a deploy with one app. When you want a single app
    to move on its own, give it its own deploy file.

    Rollback restores the whole release, apps included, from the settings saved with it. An app
    added or removed since then is handled: it is installed or retired as the restored settings
    say.
