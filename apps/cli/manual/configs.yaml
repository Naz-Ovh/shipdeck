# Every property of the root file and the deploy file, in the same shape.
# A test keeps this list exactly the JSON Schema's properties.

apps:
  type: "map"
  brief: "The apps of the deploy, by name"
deploys:
  type: "map"
  brief: "Deploy names, and the deploy file of each or the deploy written in place."
name:
  type: "text"
  brief: "The deploy's name; the default process name starts with it."
root:
  type: "true"
  brief: "Marks the file as a root file. Always `true`, and required. A deploy file never holds it."
release:
  brief: "The whole release: files that belong to no app, and the release commands."
  fields:
    exclude:
      type: "list"
      brief: "Patterns left out of `files`, matched against the path from the project folder."
    files:
      type: "list"
      brief: "Files shipped beside the apps, each at its path from the project folder."
    shared:
      type: "list"
      brief: "Folders kept across releases, each at its path in the release."
    steps:
      brief: "The release steps, with the settings each takes."
      fields:
        backup:
          brief: "Step 5: what stays on the server once a release's folder goes."
          fields:
            exclude:
              type: "list"
              brief: "Uploaded paths to leave out."
            include:
              type: "list"
              brief: "Paths setup made that it cannot make again."
            keep:
              brief: "How many old releases stay."
              fields:
                compressed:
                  type: "number"
                  brief: "Older releases kept only as their backup"
                open:
                  type: "number"
                  brief: "Releases kept unpacked and ready to switch to, counting the live one"
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        build:
          brief: "Step 2: the build, and the file collection."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            version_from:
              type: "string/null"
              brief: "The file whose version names the release."
        done:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        failed:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        health:
          brief: "Step 9: the release must answer."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            timeout_secs:
              type: "number"
              brief: "Seconds the release has to become healthy"
            url:
              type: "string/null"
              brief: "The URL fetched on the server"
        nginx:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        preflight:
          brief: "Step 1: checks before anything else."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            requires:
              type: "list"
              brief: "Programs the server must have."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        restart:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        rollback:
          brief: "Step 11: when putting an older release back."
          fields:
            ask_secs:
              type: "integer/null"
              brief: "How long `ask` waits before rolling back"
            keep_failed:
              type: "boolean/null"
              brief: "Keep the failed release folder to inspect it"
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            mode:
              type: "text or map"
              brief: "What an automatic rollback does"
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        setup:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        switch:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
        upload:
          brief: "Steps that only take commands."
          fields:
            local:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
            server:
              type: "text or map"
              brief: "One command, or a list of them run in order, stopping at the first failure."
server:
  brief: "Where the deploy runs."
  fields:
    dir:
      type: "text"
      brief: "The server folder that holds `current`, `releases/`, `backups/` and `shared/`"
    ssh:
      brief: "How to log in"
      fields:
        host:
          type: "text"
          brief: "The server's address, or an alias from `~/.ssh/config`."
        port:
          type: "integer/null"
          brief: "Default: the alias's Port, else 22."
        shell_env:
          type: "bool"
          brief: "Give server commands the environment a login shell has: PATH from nvm and the like"
        user:
          type: "string/null"
          brief: "The user shipdeck logs in and deploys as"
