[workspace]
resolver = "3"
members = ["bin/shipdeck", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
shipdeck-engine = { path = "crates/engine" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = "1.1.10"
futures = "0.3.34"
object = "0.40.0"
ratatui = "0.30.2"
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"

[profile.release]
strip = true
lto = "thin"
