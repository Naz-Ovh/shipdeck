[workspace]
resolver = "3"
members = ["bin/shipdeck", "crates/engine", "crates/headless", "crates/tui"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/Naz-Ovh/shipdeck"

[workspace.dependencies]
shipdeck-engine = { path = "crates/engine" }
shipdeck-headless = { path = "crates/headless" }
shipdeck-tui = { path = "crates/tui" }
anyhow = "1.0.104"
base16ct = { version = "1.0.0", features = ["alloc"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
fast-glob = "1.1.2"
futures = "0.3.34"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
granit-parser = { version = "2.0.0", default-features = false, features = ["std", "error_messages"] }
object = "0.40.0"
ratatui = "0.30.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
zstd = { version = "0.14.3", features = ["zstdmt"] }

[profile.release]
strip = true
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
