# A deploy file: every key, with its default.
# Paths on your PC: /x is absolute, apps/x is from the project folder
# (where you run shipdeck, or -C), ./x and ../x are from this file's folder.
# {{NAME}} placeholders work in every string; the list is in the design page.
# In a step, `server:` then `local:` run first; then shipdeck does the step.
# A command is sh, or `<runner>: <code>` with bash, zsh, node or python3.
# Rules and the server layout: docs/feature/config-v2.md.

name: shop                         # deploy name; process names start with it

server:
  ssh:
    host: prod                     # address, or an alias from ~/.ssh/config
    port: 22                       # default: the alias's Port, else 22
    user: deploy                   # default: the alias's User
    shell_env: true                # load the login shell's PATH (nvm and friends)
  dir: /opt/shop                   # {{ROOT}}: holds current, releases/, backups/, shared/

# ─── The whole release. Everything here runs or applies once. ───────────
release:
  files:                           # files that belong to no app
    - package.json                 # lands at {{CURRENT}}/package.json
    - packages                     # a folder brings everything in it
    - { path: ./prod/config.json, to: config/prod.json }   # outside the project: `to` is required
  exclude: ["**/node_modules"]     # matched against the path from the project folder
  shared: [storage]                # {{CURRENT}}/storage -> {{SHARED}}/storage

  steps:
    preflight:
      requires: [node, pnpm]       # programs the server must have
      server: node --version       # in {{ROOT}}
      local: pnpm install --frozen-lockfile   # in {{PROJECT}}
    build:
      version_from: package.json   # names the release. Default: first found, else git tag
      local: pnpm run build:shared # in {{PROJECT}}; runs before every app build
    setup:
      server: pnpm install --prod --frozen-lockfile   # in {{RELEASE}}
    backup:                        # always holds what was uploaded
      keep: { open: 5, compressed: 15 }   # releases ready to switch to, and backups
      include: [generated]         # more paths setup made that it cannot make again
      exclude: [packages/big-fixtures]   # uploaded paths to leave out
    health:
      timeout_secs: 20             # time every app has to become healthy
      server: test -d {{SHARED}}/storage   # in {{CURRENT}}, after every app is healthy
      local: curl -fsS https://example.com/   # in {{PROJECT}}
    done:
      server: echo "{{RELEASE_ID}} is live" >> {{ROOT}}/deploys.log   # in {{CURRENT}}
      local: ./notify.sh "shop {{VERSION}} is live"   # in {{PROJECT}}
    rollback:                      # when switch, restart, nginx or health fails, or by hand
      mode: ask                    # ask | auto | off
      ask_secs: 30                 # with ask: roll back on its own after this
      keep_failed: false           # true keeps the failed release to inspect it
      server: echo "putting back $SHIPDECK_PREVIOUS" >> {{ROOT}}/deploys.log   # in {{ROOT}}, before the rollback
      local: ./notify.sh "shop is rolling back"   # in {{PROJECT}}, before the rollback
    failed:                        # last, whenever a step failed
      local: ./notify.sh "shop failed at $SHIPDECK_STEP"   # in {{PROJECT}}

# ─── Apps. Everything here applies to that app only. ────────────────────
apps:
  api:
    source: services/api           # {{SOURCE}}: local source directory. Default: the project folder
    files:
      - services/api/dist          # inside source: lands at {{APP_CURRENT}}/dist
      - services/api/package.json
      - { path: services/api/dist/server, to: server }   # optional destination, in apps/api
      - { path: ./prod/api.conf, to: api.conf }          # outside source: `to` is required
    exclude: ["**/*.map"]
    binary: null                   # a compiled program; lands at apps/api/<file name>, mode 0755
    # binary: { path: target/release/api, to: bin/api }   # or with a destination in apps/api
    shared: [uploads]              # {{APP_CURRENT}}/uploads -> {{APP_SHARED}}/uploads

    process:                       # a running program; or `static: true`, never both
      name: shop-api               # {{PROCESS}}. Default: <name>-<app>
      start: node dist/main.js     # runs in {{APP_CURRENT}}. Default: the binary, ./<file name> or ./<to>
      env: { NODE_ENV: production, UPLOADS: "{{APP_SHARED}}/uploads" }
      env_file: .env               # path in the app folder
      systemd:                     # the manager: exactly one of systemd, pm2, oxmgr
        user: deploy               # default: the SSH user
        options:                   # unit properties, by section; replace built-in ones
          Unit: { After: [network-online.target, postgresql.service] }
          Service: { Restart: on-failure, MemoryMax: 1G }
        # template: ./systemd/api.service.template   # or your own whole unit; not with options
        # instances: 3             # planned, not built yet: <process>@1 to @3
      # pm2:
      #   options: { instances: 2, exec_mode: cluster }   # PM2 app properties
      #   ecosystem: ecosystem.config.js   # or your own PM2 file in the app folder
      # oxmgr:
      #   options: { restart_policy: on_failure }   # oxfile app properties

    nginx:                         # optional: without it, shipdeck only starts the app
      domains: [api.example.com]
      tls: { provider: letsencrypt, email: ops@example.com }   # or: none
      proxy_pass: http://127.0.0.1:3000   # required for process apps
      headers: { X-Frame-Options: DENY }
      locations:
        /uploads/: { alias: "{{APP_SHARED}}/uploads/", expires: 30d }
      raw: |
        client_max_body_size 20m;

    steps:
      preflight:
        server: test -w {{ROOT}}   # in {{ROOT}}
        local: pnpm --filter api test   # in {{SOURCE}}
      build:
        local: pnpm --filter api build  # in {{SOURCE}}
      setup:
        server:                    # in {{APP_RELEASE}}
          - node --check dist/main.js        # sh, the default runner
          - bash: set -o pipefail; npm run migrate | tee migrate.log
          - node: |
              const pkg = require("./package.json");
              if (!pkg.version) process.exit(1);
        local: echo "api is set up"          # in {{SOURCE}}
      backup:
        include: [dist/cache]      # paths in the app folder
        exclude: [dist/server/maps]
      health:
        url: http://127.0.0.1:3000/health   # fetched on the server
        server: test -f dist/main.js        # in {{APP_CURRENT}}
        local: curl -fsS https://api.example.com/health   # in {{SOURCE}}
      done:
        server: echo "api {{VERSION}}"      # in {{APP_CURRENT}}
        local: ./notify.sh "api is live"    # in {{SOURCE}}
      rollback:
        server: echo "api rolls back"       # in {{ROOT}}, before the rollback
      failed:
        local: ./notify.sh "api failed"     # in {{SOURCE}}

  web:
    source: apps/web
    files: [apps/web/dist]
    static: true                   # nginx serves the files; nothing runs on the server
    nginx:                         # optional: without it, shipdeck only ships the files
      root: dist                   # required for static apps: nginx serves {{APP_CURRENT}}/dist
      index: index.html            # required for static apps
      domains: [example.com, www.example.com]
      tls: { provider: letsencrypt, email: ops@example.com }
    steps:
      build:
        local: pnpm --filter web build
