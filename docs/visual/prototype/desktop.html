/* ---------- Deploy and rollback ---------- */

const STEPS = {
  connect: ["Connect", "plug", "Log in over SSH"], preflight: ["Preflight", "list-checks", "Check the server and the sudo rules"],
  build: ["Build", "hammer", ""], pack: ["Pack", "package", "Pick the files and compress them"],
  upload: ["Upload", "cloud-upload", "Send only what changed"], unpack: ["Unpack", "package-open", "Unpack and check every file"],
  setup: ["Setup", "wrench", "Write the service file"], backup: ["Backup", "archive", "Copy the live release aside"],
  switch: ["Switch", "arrow-left-right", "Point current/ at the new release"], restart: ["Restart", "rotate-cw", "Restart the service"],
  health: ["Health", "heart-pulse", "Wait for the health check"], done: ["Done", "flag", ""],
};
const STEP_MS = { connect: 700, preflight: 900, build: 3200, pack: 900, upload: 2600, unpack: 800, setup: 500, backup: 600, switch: 300, restart: 900, health: 1600, done: 200 };

function startOp(kind, a, target, opts = {}) {
  const keys = kind === "deploy" ? ["connect", "preflight", "build", "pack", "upload", "unpack", "setup", "backup", "switch", "restart", "health", "done"]
                                 : ["connect", "switch", "restart", "health", "done"];
  const prev = a.releases[0] || null;
  const v = prev ? prev.version.split(".") : ["0", "1", "-1"]; v[2] = String(+v[2] + 1);
  const two = n => String(Math.floor(Math.random() * n)).padStart(2, "0");
  const newRel = kind === "deploy" ? rel(v.join("."), "e4f5a6b", `20261031.12${two(60)}${two(60)}`, "just now", prev ? prev.size : "3.8 MB", prev ? prev.files : ["Rust", "Go"].includes(a.lang) ? [[a.id, "10.2 MB", "binary"], ["release.json", "1.0 KB", "shipdeck"]] : NODE_FILES) : null;
  S.op = { kind, app: a.id, steps: keys.map(k => ({ k, name: STEPS[k][0], st: "wait", ms: 0, pct: null, det: "" })), i: 0, t: 0, done: false, ok: false,
           summary: "", log: [], end: kind === "deploy" ? S.nextEnd : "ok", newRel, prev, target, paused: false };
  opLog(`${kind === "deploy" ? "Deploy" : "Roll back"} ${a.id} on ${a.server}`, "sys");
  if (opts.stay) render(); else nav({ at: "srv", srv: a.server, page: "app", app: a.id, tab: "deploy" });
}
function opLog(m, cls = "") { S.op.log.push({ t: stamp().slice(7), m, cls }); }

function tickOp() {
  const o = S.op;
  if (!o || o.done || o.paused) return;
  const a = app(o.app), st = o.steps[o.i];
  if (st.st === "wait") { st.st = "run"; st.det = st.k === "build" ? { Rust: "cargo zigbuild --release", "Node.js": "npm ci && npm run build", Go: "go build", Python: "Nothing to build" }[a.lang] : STEPS[st.k][2];
    if (!o.prev && st.k === "preflight") st.det = `Check the server and make ${a.dir}`;
    if (!o.prev && st.k === "setup") st.det = a.runner === "PM2" ? "Get it ready for PM2" : `Install ${a.id}.service`; }
  st.ms += 100; o.t += 100;
  const need = STEP_MS[st.k];
  if (st.k === "upload") { st.pct = Math.min(100, pct(st.ms, need)); st.det = o.prev ? `${(1.8 * st.pct / 100).toFixed(1)} MB of 1.8 MB (the rest is already there)` : `${(3.8 * st.pct / 100).toFixed(1)} MB of 3.8 MB`; }
  if (st.k === "build" && st.ms % 800 === 0) {
    const lines = a.lang === "Rust" ? ["   Compiling serde v1.0.219", "   Compiling tokio v1.47.1", `   Compiling ${a.id} v${o.newRel.version}`, "    Finished `release` profile [optimized]"]
                                    : ["added 412 packages", "> build", "dist/server.js  88 KB", "build finished"];
    opLog(lines[st.ms / 800 - 1]);
  }
  if (st.k === "pack" && st.ms === need && o.end === "same" && o.kind === "deploy" && o.prev) {
    o.paused = true; S.dialog = { kind: "unchanged" };
    opLog("This release holds exactly what the live one does.", "warn");
    render(); return;
  }
  if (st.k === "health" && st.ms === need && o.end === "health") {
    st.st = "fail"; st.det = `${a.health || "The service"}: connection refused for 30 s`;
    opLog("Health check failed: connection refused", "err");
    if (!o.prev) { o.steps.slice(o.i + 1).forEach(x => x.st = "skip"); a.releases.unshift({ ...o.newRel, failed: true }); a.status = "failed"; finishOp(false, `${o.newRel.tag} failed its health check. There is no older release to go back to.`); return; }
    o.paused = true; S.dialog = { kind: "rollback", left: 15, from: o.newRel, to: o.prev };
    render(); return;
  }
  if (st.ms >= need) {
    st.st = "ok";
    if (st.k === "upload") st.det = o.prev ? "1.8 MB sent, 2.3 MB reused" : "3.8 MB sent";
    if (st.k === "build") st.det = "Built";
    opLog(`${st.name}: done`);
    o.i++;
    if (o.i >= o.steps.length) { finishOp(true); return; }
  }
  paintOp();
}
setInterval(tickOp, 100);

function finishOp(ok, summary) {
  const o = S.op, a = app(o.app);
  o.done = true; o.ok = ok;
  if (ok && o.kind === "deploy") { a.releases.unshift(o.newRel); a.deployed = "just now"; a.status = "running"; a.pid = a.pid || 3120; a.mem = a.mem || "22 MB"; a.since = "a few seconds"; o.summary = `${o.newRel.tag} is live.`; }
  if (ok && o.kind === "rollback") {
    const i = a.releases.findIndex(r => r.id === o.target.id);
    const [r] = a.releases.splice(i, 1); a.releases.unshift(r); a.status = "running"; o.summary = `${r.tag} is live again.`;
  }
  if (summary) o.summary = summary;
  const took = `${(o.t / 1000).toFixed(1)} s`;
  D.events.unshift(ok ? { app: a.id, kind: o.kind, tag: a.releases[0].tag, when: "just now", took }
                      : { app: a.id, kind: o.summary.startsWith("Stopped") ? "stopped" : "failed", tag: o.newRel ? o.newRel.tag : "", when: "just now", took });
  opLog(o.summary, ok ? "sys" : "warn");
  toast(o.summary, ok);
  render();
}

function paintOp() {
  const el = $("#op");
  if (el) { el.outerHTML = opHtml(); const l = $("#oplog"); if (l) l.scrollTop = l.scrollHeight; }
  const m = $("#opmini");
  if (m) m.outerHTML = opMini();
}

function opHtml() {
  const o = S.op;
  const cur = o.steps[Math.min(o.i, o.steps.length - 1)];
  const res = o.done
    ? `<div class="result">${tile(o.ok ? "circle-check" : o.summary.startsWith("Stopped") ? "circle-pause" : "circle-x", o.ok ? "green" : o.summary.startsWith("Stopped") ? "slate" : "rose", "lg")}
        <div class="grow"><b>${esc(o.summary)}</b><span class="s">${o.kind === "rollback" ? "Rollback" : "Deploy"} took ${(o.t / 1000).toFixed(1)} s.</span></div>
        <button class="btn sm" data-act="op-close">Close</button></div>`
    : `<div class="card now">${tile(STEPS[cur.k][1], cur.st === "fail" ? "rose" : "sky", "lg")}<div class="grow"><b>${esc(cur.name)}</b><span class="s">${esc(cur.det || STEPS[cur.k][2])}</span>
        ${cur.pct != null ? `<div class="bar"><i style="width:${cur.pct}%"></i></div>` : ""}</div><span class="mono faint">${(o.t / 1000).toFixed(1)} s</span></div>`;
  const pipe = o.steps.map(s => `<div class="ps ${s.st}"><span class="pi">${s.st === "run" && s.k !== "upload" ? ic("loader-circle", "spin") : ic(s.st === "fail" ? "x" : STEPS[s.k][1])}</span>${esc(s.name)}<span class="pt">${s.ms ? (s.ms / 1000).toFixed(1) + " s" : ""}</span></div>`).join("");
  return `<div id="op">${res}<div class="pipe">${pipe}</div>
    <div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="src" style="margin-left:0">What shipdeck is doing</span></div>
      <div class="term-body wrap" id="oplog" style="height:auto;min-height:220px;max-height:340px">${o.log.map(l => `<div class="ln ${l.cls}"><span class="t">${l.t}</span> <span class="m">${esc(l.m)}</span></div>`).join("")}</div></div>
  </div>`;
}

/* ---------- Dialogs ---------- */

function dlg({ icon, tone = "slate", title, text = "", body = "", foot, steps, cur, wide }) {
  const stepper = steps ? `<div class="stepper">${steps.map(([n, i], k) => `${k ? '<span class="stp-line"></span>' : ""}<span class="stp ${k < cur ? "ok" : k === cur ? "on" : ""}"><span class="n">${ic(k < cur ? "check" : i)}</span>${n}</span>`).join("")}</div>` : "";
  return `<div class="scrim" data-act="scrim"><div class="dlg${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g, ""))}">
    ${stepper}<div class="hd">${icon ? tile(icon, tone, "lg") : ""}<div><h3>${title}</h3>${text ? `<p>${text}</p>` : ""}</div></div>
    ${body ? `<div class="bd">${body}</div>` : ""}<div class="ft">${foot}</div></div></div>`;
}

const ADD_STEPS = [["Address", "server"], ["Trust", "fingerprint"], ["Prepare", "wrench"], ["Ready", "circle-check"]];

function addDialog(d) {
  if (d.step === 0) return dlg({ steps: ADD_STEPS, cur: 0, icon: "server", tone: "indigo", title: "Add a server", text: "shipdeck logs in over SSH and looks for the projects it deployed there.",
    body: `<div class="row2"><div class="fld"><label for="f-host">Address</label><input id="f-host" value="${esc(d.host)}" placeholder="203.0.113.40 or an alias from ~/.ssh/config"></div>
       <div class="fld"><label for="f-port">Port</label><input id="f-port" value="22"></div></div>
     <div class="fld"><label for="f-user">User</label><input id="f-user" value="${esc(d.user)}"></div>
     <span class="hint">shipdeck uses your <code>~/.ssh/config</code>, your keys and your SSH agent, like the ssh command does.</span>`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="add-next">Connect${ic("arrow-right")}</button>` });
  if (d.step === 1) return dlg({ steps: ADD_STEPS, cur: 1, icon: "fingerprint", tone: "amber", title: "Trust this server?", text: `This is the first time you connect to <b>${esc(d.host)}</b>. Check the fingerprint with the server's owner first.`,
    body: `<div class="fp">${tile("key-round", "amber", "sm")}<span>ED25519<br>SHA256:Xp2c8Rk1mQ7vT3yL9wNbF0sJhE5gUaZ4dKoP6iCqW1M</span></div>
     <span class="hint">shipdeck saves it in <code>~/.ssh/known_hosts</code>. If it changes later, shipdeck stops and warns you.</span>`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="add-trust">Trust and continue</button>` });
  if (d.step === 2) {
    const list = l => `<ul class="checks">${l.map(x => `<li class="${x.st}"><span class="st">${x.st === "ok" ? ic("check") : x.st === "run" ? ic("loader-circle", "spin") : ic(x.icon)}</span><span class="nm">${x.name}${x.st === "ok" ? `<span class="dt">${x.det}</span>` : ""}</span></li>`).join("")}</ul>`;
    if (d.phase === "ask") return dlg({ steps: ADD_STEPS, cur: 2, icon: "wrench", tone: "violet", title: "Prepare the server, once", text: `shipdeck sets up <b>${esc(d.host)}</b> by itself. After this, you never run a command on it, not even to add a project.`,
      body: `<ul class="checks">
          <li><span class="st">${ic("package")}</span><span class="nm">Install zstd<span class="dt">To unpack releases.</span></span></li>
          <li><span class="st">${ic("folder-plus")}</span><span class="nm">Make /opt ready for your projects<span class="dt">Each project gets its own folder, owned by ${esc(d.user)}.</span></span></li>
          <li><span class="st">${ic("shield-check")}</span><span class="nm">Allow shipdeck's own tasks as root<span class="dt">Install and restart your projects' services. Nothing more.</span></span></li>
        </ul>
        <div class="fld"><label>shipdeck needs root this one time</label><div class="seg"><button class="${d.how === "sudo" ? "on" : ""}" data-act="add-how" data-v="sudo">sudo password for ${esc(d.user)}</button><button class="${d.how === "root" ? "on" : ""}" data-act="add-how" data-v="root">root password</button></div></div>
        <div class="fld"><label for="f-rootpw">Password</label><input id="f-rootpw" type="password" value="hunter2hunter2" autocomplete="off"><span class="hint">Used for this setup only. shipdeck does not save it.</span></div>`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="add-prep">${ic("wrench")}Prepare the server</button>` });
    return dlg({ steps: ADD_STEPS, cur: 2, icon: d.phase === "prep" ? "wrench" : "list-checks", tone: d.phase === "prep" ? "violet" : "sky",
      title: d.phase === "prep" ? `Preparing ${esc(d.host)}` : `Checking ${esc(d.host)}`, text: "A few seconds.",
      body: list(d.checks), foot: `<button class="btn" data-act="close">Cancel</button>` });
  }
  return dlg({ steps: ADD_STEPS, cur: 3, title: "", foot: `<button class="btn" data-act="close">Later</button><button class="btn dark" data-act="add-open">Open db-1${ic("arrow-right")}</button>`,
    body: `<div class="done-art">${tile("circle-check", "green")}</div><div style="text-align:center"><h3 style="margin:0 0 4px">The server is ready</h3><p class="muted" style="margin:0">You won't need to run anything on it again. shipdeck also found 1 project it deployed there before: <b>metrics</b>.</p></div>
      <div class="fld"><label for="f-name">Name it</label><input id="f-name" value="db-1"></div>` });
}

function renderLayer() {
  let h = "";
  const d = S.dialog;
  if (S.drawer) h += drawerHtml();
  if (d && d.kind === "add") h += addDialog(d);
  if (d && d.kind === "secret") h += dlg({ icon: "lock-keyhole", tone: "amber", title: "Passphrase for your key", text: "<code>~/.ssh/id_ed25519</code> is locked. shipdeck keeps the passphrase in memory until you close the app.",
    body: `<div class="fld"><label for="f-pw">Passphrase</label><input id="f-pw" type="password" value="hunter2hunter2" autocomplete="off"></div>`,
    foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="close-toast" data-msg="Unlocked.">Unlock</button>` });
  if (d && d.kind === "unchanged") h += dlg({ icon: "info", tone: "sky", title: "Nothing changed", text: `This release holds exactly what the live one holds. Deploy it anyway?`,
    foot: `<span class="left">No answer means no.</span><button class="btn" data-act="same-no">Don't deploy</button><button class="btn dark" data-act="same-yes">Deploy anyway</button>` });
  if (d && d.kind === "rollback") {
    const from = d.from ? d.from.tag : "v0.4.3 (e4f5a6b)", to = d.to ? d.to.tag : "v0.4.2 (a1b2c3d)";
    h += dlg({ icon: "heart-pulse", tone: "rose", title: "The health check failed", text: `The new release, <span class="mono">${esc(from)}</span>, did not answer. Roll back to <span class="mono">${esc(to)}</span>?`,
      body: `<div><div class="muted" style="font-size:12.5px;margin-bottom:8px">Rolling back by itself in <span class="count" id="cd">${d.left}</span> s.</div><div class="ring"><i id="cdbar" style="width:${100 * d.left / 15}%"></i></div></div>`,
      foot: `<button class="btn" data-act="rb-keep">Keep the new release</button><button class="btn dark" data-act="rb-now">${ic("undo-2")}Roll back now</button>` });
  }
  if (d && d.kind === "ask-rb") {
    const a = app(S.route.app), r = a.releases.find(x => x.id === d.r);
    h += dlg({ icon: "undo-2", tone: "amber", title: `Roll back ${esc(a.id)}?`, text: `<span class="mono">${esc(r.tag)}</span> becomes live again. <span class="mono">${esc(a.releases[0].tag)}</span> stays on the server, so you can switch back.`,
      foot: `<button class="btn" data-act="close">Cancel</button><button class="btn dark" data-act="rb-go" data-r="${esc(r.id)}">${ic("undo-2")}Roll back</button>` });
  }
  if (d && d.kind === "settings") {
    const seg = ["system", "light", "dark"].map(t => `<button class="${S.theme === t ? "on" : ""}" data-act="set-theme" data-v="${t}">${ic({ system: "monitor", light: "sun", dark: "moon" }[t])}${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
    h += dlg({ wide: true, icon: "settings", tone: "slate", title: "Settings", text: "For shipdeck on this PC.",
      body: `<div>
        <div class="set-row">${tile("palette", "violet")}<span class="grow"><b>Look</b><span class="s">Follow the system, or pick one.</span></span><div class="seg">${seg}</div></div>

let cdTimer = null;
function countdown() {
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    const d = S.dialog;
    if (!d || d.kind !== "rollback") { clearInterval(cdTimer); return; }
    d.left--;
    const c = $("#cd"), b = $("#cdbar");
    if (c) c.textContent = d.left;
    if (b) b.style.width = `${100 * d.left / 15}%`;
    if (d.left <= 0) { clearInterval(cdTimer); answerRollback(true); }
  }, 1000);
}
function answerRollback(yes) {
  const o = S.op; S.dialog = null; clearInterval(cdTimer);
  if (!o || !o.paused) { renderLayer(); return; }   // a preview from the mockup bar: no deploy behind it
  const a = app(o.app);
  if (!yes) {
    o.steps.slice(o.i + 1).forEach(s => s.st = "skip");
    a.releases.unshift({ ...o.newRel, failed: true }); a.status = "failed";
    o.paused = false; finishOp(false, `Kept ${o.newRel.tag}, but its health check failed.`); return;
  }
  opLog("Rolling back to " + o.prev.tag, "sys");
  const t = o.t, log = o.log;
  S.op = null; startOp("rollback", a, o.prev);
  Object.assign(S.op, { t, log: log.concat(S.op.log), i: 1 });
  S.op.steps[0].st = "ok"; S.op.steps[0].ms = 100;
  a.releases.splice(1, 0, { ...o.newRel, failed: true });   // the failed release stays on the server, below the live one
  render();
}

// The add-server checks, then (after the one-time question) the preparing, each ticking through its list.
function runList(d, items, then) {
  d.checks = items.map(x => ({ ...x, st: "wait" }));
  let i = 0;
  const next = () => {
    if (S.dialog !== d) return;
    if (i > 0) d.checks[i - 1].st = "ok";
    if (i === d.checks.length) { renderLayer(); setTimeout(() => { if (S.dialog === d) { then(); renderLayer(); } }, 500); return; }
    d.checks[i].st = "run"; i++; renderLayer();
    setTimeout(next, 650);
  };
  next();
}
function runAddChecks(d) {
  d.phase = "check";
  runList(d, [
    { icon: "key-round", name: "Log in", det: `As ${esc(d.user)}, with your SSH agent` },

    { icon: "wrench", name: "Is it prepared for shipdeck?", det: "Not yet. It needs a one-time setup." },
  ], () => { d.phase = "ask"; });
}
function runPrepare(d) {

  runList(d, [
    { icon: "package", name: "Install zstd", det: "zstd 1.4.8, from Ubuntu's packages" },
    { icon: "folder-plus", name: "Make /opt ready for your projects", det: `Owned by ${esc(d.user)}` },

document.addEventListener("click", e => {
  const x = e.target.closest("[data-act]");
  if (!x || x.disabled) return;
  const act = x.dataset.act, d = S.dialog;
  switch (act) {
    case "back": goBack(-1); return;
    case "fwd": goBack(1); return;
    case "home": S.conn = null; clearTimeout(connTimer); nav({ at: "home" }); return;
    case "open": openServer(x.dataset.s); return;
    case "open-app": { const a = app(x.dataset.a); openServer(a.server, { page: "app", app: a.id }); return; }
    case "switch": if (x.dataset.s === S.route.srv) { S.pop = false; render(); } else openServer(x.dataset.s); return;
    case "retry": openServer(S.conn.srv, S.conn.then); return;
    case "retry-srv": toast(S.online ? `Still can't reach ${x.dataset.s}.` : "You are offline.", false); return;
    case "cached": openCached(x.dataset.s); return;
    case "cancel-connect": clearTimeout(connTimer); S.conn = null; goBack(-1); if (S.route.at === "connect") nav({ at: "home" }, { replace: true }); return;
    case "disconnect": disconnect(x.dataset.s); return;
    case "pop": S.pop = !S.pop; render(); return;
    case "side": S.sideOpen = !S.sideOpen; $("#side").classList.toggle("open", S.sideOpen); return;
    case "page": page(x.dataset.p); return;
    case "app": e.stopPropagation(); page("app", { app: x.dataset.a, tab: x.dataset.t || null }); return;
    case "tab": S.route.tab = x.dataset.t; S.file = null; render(); return;
    case "filter": S.appFilter = x.dataset.f; render(); return;
    case "log-app": S.logApp = x.dataset.a; render(); return;
    case "scrim": if (e.target === x && d && !["rollback", "unchanged"].includes(d.kind)) { S.dialog = null; renderLayer(); } return;
    case "close": S.dialog = null; renderLayer(); return;
    case "dlg":
      S.pop = false;
      S.dialog = { kind: "add", step: 0, host: "203.0.113.40", user: "deploy", how: "sudo" };
      render(); return;
    case "toast": toast(x.dataset.msg); return;
    case "close-toast": S.dialog = null; renderLayer(); toast(x.dataset.msg); return;
    case "palette": S.pal = { q: "", i: 0 }; renderLayer(); return;
    case "pal-go": palGo(+x.dataset.k); return;
    case "pal-scrim": if (e.target === x) { S.pal = null; renderLayer(); } return;
    case "add-next":
      if (!S.online) { toast("You are offline.", false); return; }
      d.host = $("#f-host").value || "203.0.113.40"; d.user = $("#f-user").value || "deploy"; d.step = 1; renderLayer(); return;
    case "add-trust": d.step = 2; runAddChecks(d); return;
    case "add-how": d.how = x.dataset.v; renderLayer(); return;
    case "new-app": S.pop = false; newDraft(); return;
    case "su-open": e.stopPropagation(); page("setup", { draft: x.dataset.d }); return;
    case "su-del": { e.stopPropagation(); const dd = draft(x.dataset.d); D.drafts = D.drafts.filter(z => z !== dd); toast(`Deleted the draft${dd.name ? " " + dd.name : ""}.`); render(); return; }
    case "src-choose": pickFolder(draft(S.route.draft), "storefront"); return;
    case "src-recent": pickFolder(draft(S.route.draft), x.dataset.n); return;
    case "git-host": S.git = S.git === x.dataset.h ? null : x.dataset.h; render(); return;
    case "git-link": S.gitLinked[x.dataset.h] = true; toast("Connected. shipdeck can read your repositories."); render(); return;
    case "git-import": pickRepo(draft(S.route.draft), x.dataset.r); return;
    case "git-clone": { const u = ($("#git-url").value || "").trim(); const n = u.split("/").pop().replace(/\.git$/, "") || "storefront"; pickRepo(draft(S.route.draft), n); return; }
    case "su-change": { const dd = draft(S.route.draft); dd.change = !dd.change; render(); return; }
    case "su-preset": { const dd = draft(S.route.draft); applyPreset(dd, x.dataset.k); dd.kind = { rust: "rust", nodejs: "next", golang: "go", python: "python" }[x.dataset.k]; dd.change = false; dd.saved = "just now"; render(); return; }
    case "su-more": { const dd = draft(S.route.draft); dd.more = !dd.more; render(); return; }
    case "su-manager": { const dd = draft(S.route.draft); dd.manager = x.dataset.v; render(); return; }
    case "su-trigger": { const dd = draft(S.route.draft); dd.trigger = x.dataset.v; render(); return; }
    case "su-buildon": { const dd = draft(S.route.draft); dd.buildOn = x.dataset.v; render(); return; }
    case "env-reveal": { const dd = draft(S.route.draft); dd.revealAll = !dd.revealAll; if (!dd.revealAll) dd.env.forEach(z => z.shown = false); render(); return; }
    case "env-eye": { const dd = draft(S.route.draft), en = dd.env[+x.dataset.i]; en.shown = !(en.shown || dd.revealAll); if (!en.shown) dd.revealAll = false; render(); return; }
    case "env-add": { const dd = draft(S.route.draft); dd.env.push({ k: "", v: "", from: "you", shown: true }); render(); $(`[data-env="${dd.env.length - 1}"][data-k="k"]`)?.focus(); return; }
    case "env-del": { const dd = draft(S.route.draft); dd.env.splice(+x.dataset.i, 1); render(); return; }
    case "su-save": { const dd = draft(S.route.draft); dd.saved = "just now"; render(); toast("Saved the draft. Find it in Projects."); return; }
    case "su-back": { const dd = draft(S.route.draft); dd.step = 2; S.op = null; render(); return; }
    case "su-finish": { const dd = draft(S.route.draft), id = dd.app; D.drafts = D.drafts.filter(z => z !== dd); S.op = null; nav({ at: "srv", srv: dd.server, page: "app", app: id }, { replace: true }); return; }
    case "su-close": {
      const dd = draft(S.route.draft);
      if (dd.app && S.op && S.op.app === dd.app && S.op.done && S.op.ok) { D.drafts = D.drafts.filter(z => z !== dd); page("app", { app: dd.app }); return; }
      if (!dd.folder) D.drafts = D.drafts.filter(z => z !== dd);
      else { dd.saved = dd.saved || "just now"; toast(`Kept ${dd.name || "the project"} as a draft.`); }
      page("apps"); return;
    }
    case "su-deploy": deployDraft(draft(S.route.draft)); return;
    case "add-prep": runPrepare(d); return;
    case "add-open": {
      const name = ($("#f-name").value || "db-1").trim();
      if (!server(name)) {
        D.servers.push({ id: name, host: d.host, user: d.user, os: "Ubuntu 22.04", logo: "ubuntu", arch: "x86_64", reach: true, seen: "11:42", uptime: "120 days", load: "0.11  0.09  0.07", cpu: 2, cpuHist: wave(6, 3, 24, 7), mem: [1.3, 4], disk: [22, 60] });
        D.apps.push({ id: "metrics", server: name, runner: "systemd", lang: "Go", status: "running", since: "12 days", pid: 911, mem: "24 MB", dir: "/opt/metrics", local: null, health: "", deployed: "12 days ago",
          releases: [rel("3.1.0", "d1e2f30", "20261019.101010", "12 days ago", "6.2 MB", [["metrics", "15.1 MB", "binary"], ["release.json", "1.0 KB", "shipdeck"]])] });
      }
      S.dialog = null; S.firstRun = false; $("#m-first").textContent = "First run: off";
      S.connected[name] = "live"; S.enter = true;
      nav({ at: "srv", srv: name, page: "overview" }); return;
    }
    case "rel": e.stopPropagation(); S.drawer = x.dataset.r; renderLayer(); return;
    case "drawer-close": S.drawer = null; renderLayer(); return;
    case "ask-rb": e.stopPropagation(); S.dialog = { kind: "ask-rb", r: x.dataset.r }; renderLayer(); return;
    case "rb-go": { const a = app(S.route.app), r = a.releases.find(z => z.id === x.dataset.r); S.dialog = null; S.drawer = null; startOp("rollback", a, r); return; }
    case "deploy": e.stopPropagation(); S.nextEnd = $("#m-next").value; startOp("deploy", app(x.dataset.a)); return;
    case "open-op": { const a = app(S.op.app); openServer(a.server, { page: "app", app: a.id, tab: "deploy" }); return; }
    case "op-close": { const id = S.op.app; S.op = null; S.route.tab = "overview"; render(); toast(`Back to ${id}.`); return; }
    case "same-no": { const o = S.op; S.dialog = null; if (o && o.paused) { o.paused = false; o.steps.slice(o.i + 1).forEach(s => s.st = "skip"); o.steps[o.i].st = "ok"; finishOp(false, "Stopped: nothing changed since the live release."); } else renderLayer(); return; }
    case "same-yes": { S.dialog = null; if (S.op && S.op.paused) { S.op.paused = false; S.op.end = "ok"; opLog("Deploying it anyway, as a copy of the live release."); } renderLayer(); return; }
    case "rb-now": answerRollback(true); return;
    case "rb-keep": answerRollback(false); return;
    case "svc": e.stopPropagation(); svc(app(x.dataset.a), x.dataset.v); return;
    case "ctx-i": { const it = S.ctx.items[+x.dataset.k]; S.ctx = null; renderLayer(); it.run(); return; }
    case "menu": if (S.ctx && S.ctx.menu === x.dataset.m) { S.ctx = null; renderLayer(); } else openMenu(x.dataset.m); return;
    case "settings": S.pop = false; S.dialog = { kind: "settings" }; render(); return;
    case "set-theme": setTheme(x.dataset.v); return;
    case "set-idle": S.idleMs = +x.dataset.v; idleLabel(); renderLayer(); return;
    case "idle-fast": S.idleMs = S.idleMs === 20000 ? 600000 : 20000; idleLabel(); render(); return;
    case "export": toast("Saved shipdeck-backup-2026-10-31 in Downloads."); return;
    case "import": S.dialog = { kind: "import" }; renderLayer(); return;
    case "cd": S.path[S.route.srv] = x.dataset.p; S.file = null; render(); return;
    case "open-file": S.file = x.dataset.p; render(); return;
    case "follow": S.follow = !S.follow; render(); return;
    case "wrap": S.wrap = !S.wrap; render(); return;
    case "theme": setTheme(x.closest(".mock") ? { system: "light", light: "dark", dark: "system" }[S.theme] : isDark() ? "light" : "dark"); return;
    case "net": S.online = !S.online; x.textContent = "Network: " + (S.online ? "online" : "offline"); render(); return;
    case "first-run": S.firstRun = !S.firstRun; x.textContent = "First run: " + (S.firstRun ? "on" : "off"); if (S.firstRun) { S.connected = {}; S.leftAt = {}; S.back = []; S.fwd = []; S.route = { at: "home" }; } render(); return;
    case "reset":
      clearTimeout(connTimer); clearInterval(cdTimer); D = freshData();
      Object.assign(S, { route: { at: "home" }, back: [], fwd: [], online: true, firstRun: false, connected: {}, leftAt: {}, idleMs: 600000, conn: null, op: null, dialog: null, drawer: null, pop: false, pal: null, ctx: null,
                         path: {}, file: null, logs: {}, logApp: null, appFilter: "all", logq: "" });
      $("#m-net").textContent = "Network: online"; $("#m-first").textContent = "First run: off"; idleLabel(); render(); return;
  }
});
// Close the server menu and the right-click menu when clicking anywhere else. Only the menu is removed,
// so the click still lands on what is under it.
document.addEventListener("mousedown", e => {
  if (S.pop && !e.target.closest(".sw-pop, .srv-sw")) { S.pop = false; $(".sw-pop")?.remove(); $(".srv-sw")?.classList.remove("on"); }
  if (S.ctx && !e.target.closest(".ctx, .mb")) { S.ctx = null; $(".ctx")?.remove(); syncMenubar(); }
});
// Inside the app, the browser's own menu never shows. Projects, servers and releases have their own.
document.addEventListener("contextmenu", e => {
  if (!e.target.closest(".win, #layer") || e.target.closest("input, pre, .term-body")) return;
  e.preventDefault();
  const t = e.target.closest("[data-ctx]");
  if (!t) return;
  const v = t.dataset.ctx, i = v.indexOf(":");
  S.ctx = { x: e.clientX, y: e.clientY, items: ctxItems(v.slice(0, i), v.slice(i + 1)) };
  renderLayer();
});

document.addEventListener("input", e => {
  const t = e.target;
  if (S.route.page === "setup" && (t.dataset.f || t.dataset.env != null)) {
    const dd = draft(S.route.draft);
    if (t.dataset.f) setField(dd, t.dataset.f, t.value); else dd.env[+t.dataset.env][t.dataset.k] = t.value;
    touched(dd);
  }
  if (e.target.id === "logq") { S.logq = e.target.value; paintLogs(true); }
  if (e.target.id === "pal-q") { S.pal.q = e.target.value; S.pal.i = 0; renderLayer(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "su-server") { const dd = draft(S.route.draft); dd.server = e.target.value; render(); }
});
$("#m-dlg").addEventListener("change", e => {
  const k = e.target.value; e.target.value = "";
  if (!k) return;
  S.dialog = k === "rollback" ? { kind: "rollback", left: 15 } : k === "add" ? { kind: "add", step: 0, host: "203.0.113.40", user: "deploy", how: "sudo" } : { kind: k };
  render();
});
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, key = e.key.toLowerCase(), r = S.route;
  if (mod && key === "k") { e.preventDefault(); S.ctx = null; S.pal = S.pal ? null : { q: "", i: 0 }; renderLayer(); return; }
  if (mod && key === ",") { e.preventDefault(); S.dialog = { kind: "settings" }; renderLayer(); return; }
  if (mod && key === "d" && r.at === "srv" && r.page === "app" && !S.dialog) {
    e.preventDefault();
    const a = app(r.app), why = deployWhy(a);
    if (why) toast(why, false); else { S.nextEnd = $("#m-next").value; startOp("deploy", a); }
    return;
  }
  if (mod && key === "l" && r.at === "srv" && !S.dialog) { e.preventDefault(); if (r.page === "app") { r.tab = "logs"; render(); } else page("logs"); return; }
  if (S.ctx && e.key === "Escape") { S.ctx = null; renderLayer(); return; }
  if (S.pal) {
    if (e.key === "ArrowDown") { e.preventDefault(); S.pal.i = Math.min(S.pal.i + 1, S.pal.items.length - 1); renderLayer(); }
    if (e.key === "ArrowUp") { e.preventDefault(); S.pal.i = Math.max(S.pal.i - 1, 0); renderLayer(); }
    if (e.key === "Enter") { e.preventDefault(); palGo(S.pal.i); }
    if (e.key === "Escape") { S.pal = null; renderLayer(); }
    return;
  }
  if (e.key === "Escape") {
    if (S.dialog && !["rollback", "unchanged"].includes(S.dialog.kind)) { S.dialog = null; renderLayer(); }
    else if (S.drawer) { S.drawer = null; renderLayer(); }
    else if (S.pop) { S.pop = false; render(); }
  }
  if (e.altKey && e.key === "ArrowLeft") goBack(-1);
  if (e.altKey && e.key === "ArrowRight") goBack(1);
});

$("#tb-back").innerHTML = ic("arrow-left");
$("#tb-fwd").innerHTML = ic("arrow-right");
$("#tb-home").innerHTML = ic("house");
$("#tb-mark").innerHTML = ic("ship");
$("#tb-ctl").innerHTML = `<span>${ic("minus")}</span><span>${ic("square")}</span><span class="x">${ic("x")}</span>`;

// The address keeps the screen (#prod-1/app/my-api/logs), so a link opens the same screen, already connected.
(() => {
  const [sid, pg, aid, tab] = decodeURIComponent(location.hash.slice(1)).split("/");
  const s = server(sid);
  if (!s) return;
  S.connected[s.id] = reach(s) ? "live" : "cache";
  const pages = ["apps", "deploys", "logs", "files", "access", "settings", ...Object.keys(LATER)];
  S.route = { at: "srv", srv: s.id, page: pages.includes(pg) ? pg : "overview" };
  if (pg === "app" && app(aid) && app(aid).server === s.id) Object.assign(S.route, { page: "app", app: aid, tab: tab || null });
  if (pg === "setup" && draft(aid) && draft(aid).server === s.id) Object.assign(S.route, { page: "setup", draft: aid });
})();
render();
</script>
