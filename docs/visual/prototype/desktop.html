<!doctype html>
<!--
  p2a1: a clickable mockup of the shipdeck desktop app. Throwaway: made-up data, no engine, no network.
  It answers one question: what should the desktop app look like, and how does a person move through it?

  Second take (2026-10-31): everything starts from a server. Home lists the servers. Opening one connects to
  it, and only then does its sidebar appear: its projects, deployments, logs and files, and later its domains,
  databases, apps (ready-made ones, like n8n) and mail. Your own code is a project. One deploy runs at a time. It should feel like a native desktop app,
  not a web page: the arrow cursor, no text selection on controls, right-click menus, keyboard shortcuts,
  and a Settings window (with the backup export and import of p1c6).

  Icons: Lucide (ISC) and Simple Icons (CC0), inlined in the sprite below so the page works offline.
  The bar at the bottom of the page is not part of the app: it switches the theme and the network, shows
  the first run, sets how the next deploy ends, and opens each dialog.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #dedee4; --page: #f3f3f5; --panel: #ffffff; --raise: #ffffff; --sunk: #f6f6f8;
    --line: #ebebef; --line-2: #dcdce3; --hover: #f4f4f7; --sel: #eeeef2;
    --ink: #141418; --muted: #686874; --faint: #a2a2ad;
    --btn: #131316; --btn-ink: #ffffff; --btn-hover: #2b2b31;
    --accent: #5b4ff5; --grad: linear-gradient(135deg, #5b4ff5 0%, #3b82f6 55%, #06b6d4 100%);
    --ok: #16a34a; --ok-soft: #e7f7ed; --bad: #dc2626; --bad-soft: #fdecec;
    --warn: #b86e00; --warn-soft: #fdf3e1; --run: #2f6fe4; --run-soft: #e8f0fe; --idle-soft: #f0f0f3;
    --t-indigo: #5b4ff5; --t-indigo-s: #efedff; --t-orange: #ea580c; --t-orange-s: #fff0e6;
    --t-sky: #0284c7; --t-sky-s: #e5f4fc; --t-green: #16a34a; --t-green-s: #e7f7ed;
    --t-pink: #db2777; --t-pink-s: #fdeaf3; --t-amber: #d97706; --t-amber-s: #fef3e2;
    --t-violet: #7c3aed; --t-violet-s: #f3edff; --t-teal: #0d9488; --t-teal-s: #e2f6f3;
    --t-slate: #475569; --t-slate-s: #eef1f5; --t-rose: #e11d48; --t-rose-s: #fdebef;
    --term: #0f0f12; --term-ink: #d7d7de; --term-dim: #72727e;
    --shadow-win: 0 1px 2px rgba(0,0,0,.05), 0 30px 80px rgba(20,20,40,.16);
    --pop: 0 8px 24px rgba(16,16,24,.08), 0 28px 56px rgba(16,16,24,.12);
    --logo-mix: 12%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #000000; --page: #0c0c0e; --panel: #151518; --raise: #1a1a1e; --sunk: #111114;
      --line: #24242a; --line-2: #303037; --hover: #1d1d22; --sel: #232329;
      --ink: #ededf1; --muted: #a2a2ad; --faint: #6b6b76;
      --btn: #f2f2f4; --btn-ink: #111114; --btn-hover: #d8d8de;
      --accent: #8b82ff;
      --ok: #3ccf7a; --ok-soft: #102a1b; --bad: #ff6b6b; --bad-soft: #3a1616;
      --warn: #f2b23e; --warn-soft: #33260b; --run: #6aa5ff; --run-soft: #15233d; --idle-soft: #202025;
      --t-indigo: #8b82ff; --t-indigo-s: #221f47; --t-orange: #fb8a4c; --t-orange-s: #3a2010;
      --t-sky: #4cb6f0; --t-sky-s: #0f2838; --t-green: #3ccf7a; --t-green-s: #102a1b;
      --t-pink: #f472b6; --t-pink-s: #3a1328; --t-amber: #f2b23e; --t-amber-s: #33260b;
      --t-violet: #a78bfa; --t-violet-s: #27193f; --t-teal: #2dd4bf; --t-teal-s: #0d2c29;
      --t-slate: #94a3b8; --t-slate-s: #1e232b; --t-rose: #fb7185; --t-rose-s: #3a1420;
      --shadow-win: 0 1px 2px rgba(0,0,0,.6), 0 30px 80px rgba(0,0,0,.6);
      --pop: 0 8px 24px rgba(0,0,0,.4), 0 28px 56px rgba(0,0,0,.5);
      --logo-mix: 20%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #000000; --page: #0c0c0e; --panel: #151518; --raise: #1a1a1e; --sunk: #111114;
    --line: #24242a; --line-2: #303037; --hover: #1d1d22; --sel: #232329;
    --ink: #ededf1; --muted: #a2a2ad; --faint: #6b6b76;
    --btn: #f2f2f4; --btn-ink: #111114; --btn-hover: #d8d8de;
    --accent: #8b82ff;
    --ok: #3ccf7a; --ok-soft: #102a1b; --bad: #ff6b6b; --bad-soft: #3a1616;
    --warn: #f2b23e; --warn-soft: #33260b; --run: #6aa5ff; --run-soft: #15233d; --idle-soft: #202025;
    --t-indigo: #8b82ff; --t-indigo-s: #221f47; --t-orange: #fb8a4c; --t-orange-s: #3a2010;
    --t-sky: #4cb6f0; --t-sky-s: #0f2838; --t-green: #3ccf7a; --t-green-s: #102a1b;
    --t-pink: #f472b6; --t-pink-s: #3a1328; --t-amber: #f2b23e; --t-amber-s: #33260b;
    --t-violet: #a78bfa; --t-violet-s: #27193f; --t-teal: #2dd4bf; --t-teal-s: #0d2c29;
    --t-slate: #94a3b8; --t-slate-s: #1e232b; --t-rose: #fb7185; --t-rose-s: #3a1420;
    --shadow-win: 0 1px 2px rgba(0,0,0,.6), 0 30px 80px rgba(0,0,0,.6);
    --pop: 0 8px 24px rgba(0,0,0,.4), 0 28px 56px rgba(0,0,0,.5);
    --logo-mix: 20%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--desk); color: var(--ink);
    font: 13.5px/1.5 Geist, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 14px 72px; overflow-x: hidden;
  }
  /* A desktop app, not a web page: the arrow cursor everywhere, and only real text can be selected. */
  body, button, [data-act] { cursor: default; }
  .win, #layer { -webkit-user-select: none; user-select: none; }
  .win input, #layer input { cursor: text; }
  .mono, code, pre, .term-body, .kv dd, .fp, input { -webkit-user-select: text; user-select: text; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  .term-body::-webkit-scrollbar-thumb { background-color: #3a3a42; }
  button, input, select { font: inherit; color: inherit; }
  code, .mono { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 12px; }
  code { background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  svg.b { width: 18px; height: 18px; flex: none; fill: currentColor; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-18px); } }
  kbd {
    font: 500 10.5px/1 Geist, sans-serif; color: var(--muted); background: var(--panel);
    border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px;
  }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .sp { flex: 1; }

  /* The window */
  .win {
    width: 100%; max-width: 1440px; height: calc(100vh - 86px); min-height: 600px;
    background: var(--page); border: 1px solid var(--line-2); border-radius: 10px;
    box-shadow: var(--shadow-win); display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .titlebar { height: 40px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 0 0 10px; color: var(--faint); }
  .titlebar .t { flex: 1; text-align: center; font-size: 12px; }
  .titlebar .ctl { display: flex; align-self: stretch; }
  .titlebar > .mark { width: 20px; height: 20px; border-radius: 6px; margin: 0 8px 0 2px; }
  .titlebar > .mark svg { width: 12px; height: 12px; }
  .titlebar .tb-sep { width: 1px; height: 16px; background: var(--line-2); margin: 0 6px; }
  .titlebar #tb-theme { margin-right: 4px; }
  .titlebar .ctl span { width: 46px; display: grid; place-items: center; color: var(--muted); }
  .titlebar .ctl span:hover { background: var(--hover); color: var(--ink); }
  .titlebar .ctl span.x:hover { background: #e81123; color: #fff; }
  .titlebar .ctl svg { width: 15px; height: 15px; stroke-width: 1.5; }
  .icon-btn {
    width: 30px; height: 30px; border: 0; background: none; border-radius: 8px; color: var(--muted);
    display: inline-grid; place-items: center; flex: none;
  }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn:disabled { opacity: .35; cursor: default; background: none; color: var(--muted); }
  #app { flex: 1; min-height: 0; display: flex; position: relative; }

  /* Pieces used everywhere */
  .mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--grad); color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .mark svg { width: 17px; height: 17px; stroke-width: 2; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .tile { --tile: var(--t-slate); --tile-s: var(--t-slate-s); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--tile-s); color: var(--tile); }
  .tile.sm { width: 28px; height: 28px; border-radius: 8px; } .tile.sm svg { width: 14px; height: 14px; }
  .tile.lg { width: 44px; height: 44px; border-radius: 13px; } .tile.lg svg { width: 21px; height: 21px; }
  .tile.round { border-radius: 50%; }
  .indigo { --tile: var(--t-indigo); --tile-s: var(--t-indigo-s); } .orange { --tile: var(--t-orange); --tile-s: var(--t-orange-s); }
  .sky { --tile: var(--t-sky); --tile-s: var(--t-sky-s); } .green { --tile: var(--t-green); --tile-s: var(--t-green-s); }
  .pink { --tile: var(--t-pink); --tile-s: var(--t-pink-s); } .amber { --tile: var(--t-amber); --tile-s: var(--t-amber-s); }
  .violet { --tile: var(--t-violet); --tile-s: var(--t-violet-s); } .teal { --tile: var(--t-teal); --tile-s: var(--t-teal-s); }
  .slate { --tile: var(--t-slate); --tile-s: var(--t-slate-s); } .rose { --tile: var(--t-rose); --tile-s: var(--t-rose-s); }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--c) var(--logo-mix), transparent); color: var(--c);
  }
  :root[data-theme="dark"] .logo { color: color-mix(in srgb, var(--c) 70%, white); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo { color: color-mix(in srgb, var(--c) 70%, white); } }
  .logo.xs { width: 22px; height: 22px; border-radius: 6px; } .logo.xs svg { width: 12px; height: 12px; }
  .logo.sm { width: 28px; height: 28px; border-radius: 8px; } .logo.sm svg { width: 15px; height: 15px; }
  .logo.lg { width: 44px; height: 44px; border-radius: 13px; } .logo.lg svg { width: 23px; height: 23px; }
  .logo.xl { width: 56px; height: 56px; border-radius: 16px; } .logo.xl svg { width: 29px; height: 29px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; background: var(--idle-soft); color: var(--muted); white-space: nowrap;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.run { background: var(--run-soft); color: var(--run); }
  .chip.run .dot { animation: pulse 1.1s infinite; }
  .chip.line { background: none; border: 1px solid var(--line-2); }
  .chip svg { width: 12px; height: 12px; }
  .dot-only { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot-only.ok { background: var(--ok); } .dot-only.warn { background: var(--warn); } .dot-only.run { background: var(--run); animation: pulse 1.1s infinite; }
  .bar { height: 5px; border-radius: 9px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; background: var(--tile, var(--ink)); transition: width .25s; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px;
    border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink);
    font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.dark { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .btn.dark:hover { background: var(--btn-hover); }

  .btn.ghost { border-color: transparent; background: none; } .btn.ghost:hover { background: var(--hover); }
  .btn.danger { color: var(--bad); }
  .btn.sm { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; } .btn.sm svg { width: 14px; height: 14px; }
  .btn.lg { height: 42px; padding: 0 18px; border-radius: 12px; font-size: 14px; }
  .btn.sq { width: 34px; padding: 0; } .btn.sm.sq { width: 28px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; box-shadow: none; }
  .btn:focus-visible, .icon-btn:focus-visible, .nav-i:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
  .card-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-hd h2 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; }
  .more { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 4px 6px; border-radius: 7px; }
  .more:hover { color: var(--ink); background: var(--hover); }
  .more svg { width: 14px; height: 14px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; margin: 0; }
  .kv dt { color: var(--muted); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .kv dt svg { width: 14px; height: 14px; color: var(--faint); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .note { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
  .note.warn { background: var(--warn-soft); border-color: transparent; }
  .note .grow { flex: 1; min-width: 0; }
  .note b { font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .grp-title { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 0 0 10px; }

  /* Home: the servers */
  .home { flex: 1; overflow-y: auto; padding: 4px 36px 40px; }
  .home-in { max-width: 1060px; margin: 0 auto; }
  .home-top { display: flex; align-items: center; gap: 8px; margin-bottom: 34px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .pill-btn:hover { color: var(--ink); border-color: var(--line-2); }
  .hero { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .hero h1 { font-size: 30px; font-weight: 600; letter-spacing: -.025em; margin: 0; line-height: 1.2; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }
  .grid-srv { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .srv-card {
    all: unset; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
    transition: border-color .12s, background .12s;
  }
  .srv-card:hover { border-color: var(--line-2); }
  .srv-card:active { background: var(--hover); }
  .srv-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sc-top { display: flex; align-items: center; gap: 12px; }
  .sc-name { flex: 1; min-width: 0; }
  .sc-name b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .sc-name .mono { color: var(--muted); }
  .sc-apps { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .logo-stack { display: flex; padding-left: 6px; }
  .logo-stack .logo { margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); background: color-mix(in srgb, var(--c) var(--logo-mix), var(--panel)); }
  .sc-meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .mtr { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .mtr .l { display: flex; align-items: center; gap: 5px; }
  .mtr .l svg { width: 13px; height: 13px; color: var(--tile); }
  .mtr .l b { margin-left: auto; color: var(--ink); font-weight: 500; white-space: nowrap; }
  .sc-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--line); }
  .sc-foot .go { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 500; }
  .sc-foot .go svg { width: 15px; height: 15px; transition: transform .16s; }
  .srv-card:hover .go svg { transform: translateX(3px); }
  .add-card {
    all: unset; box-sizing: border-box; border: 1.5px dashed var(--line-2); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 150px;
    color: var(--muted); text-align: center; padding: 18px;
  }
  .add-card:hover { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .add-card b { font-weight: 600; color: var(--ink); }
  .add-card span.s { font-size: 12px; max-width: 220px; }
  .recent { margin-top: 30px; }
  .rc-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .rc {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  }
  .rc:hover { border-color: var(--line-2); }
  .rc:active { background: var(--hover); }
  .rc b { font-weight: 600; display: block; line-height: 1.25; } .rc .s { font-size: 11.5px; color: var(--muted); }

  .empty-hero { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 40px 24px 36px; text-align: center; }
  .empty-hero h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 6px 0 6px; }
  .empty-hero p { color: var(--muted); margin: 0 auto 22px; max-width: 460px; }
  .empty-hero .acts { justify-content: center; }
  .illus { width: 260px; max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .feats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .feat { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: left; min-width: 0; }
  .feat .tile { margin-bottom: 14px; }
  .feat b { display: block; font-weight: 600; }
  .feat span { color: var(--muted); font-size: 12.5px; }

  /* Connecting */
  .connect { flex: 1; display: grid; place-items: center; padding: 24px; overflow: auto; }
  .cn { width: 100%; max-width: 540px; text-align: center; animation: rise .3s; }
  .cn-art { display: flex; align-items: center; justify-content: center; margin-bottom: 26px; }
  .cn-node { width: 66px; height: 66px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--pop); }
  .cn-node > svg.i { width: 28px; height: 28px; color: var(--muted); }
  .cn-node .logo { width: 48px; height: 48px; border-radius: 14px; } .cn-node .logo svg { width: 25px; height: 25px; }
  .cn-wire { width: 130px; height: 2px; position: relative; background-image: radial-gradient(circle, var(--faint) 1px, transparent 1.4px); background-size: 8px 2px; }
  .cn-wire::after {
    content: ""; position: absolute; top: -4px; left: 0; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent);
    animation: travel 1.1s ease-in-out infinite alternate;
  }
  .cn-wire.ok::after { animation: none; left: calc(50% - 5px); background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 20%, transparent); }
  .cn-wire.fail::after { animation: none; left: calc(50% - 5px); background: var(--bad); box-shadow: 0 0 0 5px color-mix(in srgb, var(--bad) 20%, transparent); }
  @keyframes travel { to { left: calc(100% - 10px); } }
  .cn h2 { font-size: 21px; margin: 0; font-weight: 600; letter-spacing: -.02em; }
  .cn .sub { color: var(--muted); margin: 4px 0 22px; }
  .checks { list-style: none; margin: 0; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; text-align: left; }
  .checks li { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; }
  .checks .st { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--faint); flex: none; }
  .checks .st svg { width: 15px; height: 15px; }
  .checks li.run .st { background: var(--run-soft); color: var(--run); }
  .checks li.ok .st { background: var(--ok-soft); color: var(--ok); }
  .checks li.fail .st { background: var(--bad-soft); color: var(--bad); }
  .checks .nm { flex: 1; min-width: 0; font-weight: 500; }
  .checks .dt { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .checks li.wait .nm { color: var(--faint); }
  .cn .acts { justify-content: center; margin-top: 20px; }

  /* The server workspace */
  .ws { flex: 1; display: flex; min-width: 0; padding: 0 12px 12px; gap: 12px; position: relative; }
  .side { width: 256px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .side.enter { animation: slide-in .4s cubic-bezier(.2,.8,.2,1); }
  .srv-sw {
    margin: 10px 10px 4px; display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--sunk); width: calc(100% - 20px); text-align: left;
  }
  .srv-sw:hover, .srv-sw.on { border-color: var(--line-2); background: var(--hover); }
  .srv-sw .nm { flex: 1; min-width: 0; }
  .srv-sw b { display: flex; align-items: center; gap: 7px; font-weight: 600; }
  .srv-sw .mono { font-size: 11px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srv-sw > svg.i { color: var(--faint); }
  .side-nav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .grp { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 16px 10px 6px; }
  .nav-i {
    display: flex; align-items: center; gap: 11px; width: 100%; height: 36px; padding: 0 10px; border: 0; background: none;
    border-radius: 10px; color: var(--muted); text-align: left; font-weight: 500;
  }
  .nav-i svg.i { width: 17px; height: 17px; transition: color .15s; }

  .nav-i.on { background: var(--sel); color: var(--ink); }
  .nav-i .n { flex: 1; }
  .nav-i .x { font-size: 11.5px; color: var(--faint); }
  .soon { font-size: 10px; font-weight: 600; letter-spacing: .02em; padding: 2px 6px; border-radius: 6px; background: var(--sunk); color: var(--faint); border: 1px solid var(--line); }
  .side-ft { padding: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .side-add {
    height: 36px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--ink); font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .side-add:hover { background: var(--hover); }
  .side-add svg { color: var(--muted); }
  .eng { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 2px 0 6px; }
  .op-mini { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; background: var(--sunk); }
  .op-mini:hover { border-color: var(--line-2); }
  .op-mini .row { display: flex; align-items: center; gap: 8px; }
  .op-mini .row svg { width: 14px; height: 14px; }
  .op-mini .s { color: var(--muted); }
  .op-mini .bar i { background: var(--run); }
  .op-mini.ok .row svg { color: var(--ok); } .op-mini.bad .row svg { color: var(--bad); }
  .sw-pop {
    position: absolute; top: 104px; left: 10px; right: 10px; z-index: 20; background: var(--raise);
    border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--pop); padding: 6px; animation: rise .15s;
  }
  .pop-g { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 4px; font-weight: 600; }
  .pop-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 10px; text-align: left; }
  .pop-i:hover { background: var(--hover); }
  .pop-i .nm { flex: 1; min-width: 0; } .pop-i .nm .s { display: block; font-size: 11.5px; color: var(--muted); }
  .pop-i > svg.i { color: var(--muted); }
  .pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 2px 4px 4px; }
  .crumbs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; color: var(--muted); overflow: hidden; }
  .crumbs button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 5px 8px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
  .crumbs button:hover { background: var(--hover); color: var(--ink); }
  .crumbs .here { color: var(--ink); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; white-space: nowrap; }
  .crumbs .sep { color: var(--faint); display: inline-flex; } .crumbs .sep svg { width: 14px; height: 14px; }
  .crumbs svg.i { width: 15px; height: 15px; }
  .kbtn {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 11px; border: 1px solid var(--line);
    border-radius: 11px; background: var(--panel); color: var(--faint); width: 230px; flex: none;
  }
  .kbtn:hover { border-color: var(--line-2); color: var(--muted); }
  .kbtn kbd { margin-left: auto; }
  .menu-btn { display: none; }
  .content { flex: 1; overflow-y: auto; padding: 10px 6px 28px; }
  .page-hd { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-hd h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.25; }
  .page-hd .sub { color: var(--muted); margin: 3px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .page-hd .grow { flex: 1; min-width: 220px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .offline {
    display: flex; gap: 12px; align-items: center; margin: 0 0 16px; padding: 11px 14px; border-radius: 14px;
    background: var(--warn-soft); color: var(--warn);
  }
  .offline span { color: var(--ink); flex: 1; }

  /* Overview */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .stat .top { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
  .stat .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
  .stat .v small { font-size: 12.5px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .spark { width: 100%; height: 30px; display: block; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .row-i { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; border: 0; background: none; width: 100%; text-align: left; }
  .row-i:hover { background: var(--hover); }
  .row-i .nm { flex: 1; min-width: 0; }
  .row-i b { font-weight: 600; display: block; }
  .row-i .s { font-size: 12px; color: var(--muted); }
  .row-i > svg.i { color: var(--faint); }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: flex; gap: 12px; padding: 7px 0; position: relative; }
  .tl li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 41px; bottom: -3px; width: 1.5px; background: var(--line); }
  .tl .tile { width: 32px; height: 32px; border-radius: 50%; } .tl .tile svg { width: 15px; height: 15px; }
  .tl .tx { flex: 1; min-width: 0; padding-top: 1px; }
  .tl .tx .s { display: block; font-size: 12px; color: var(--muted); }
  .app-link { font-weight: 600; } .app-link:hover { color: var(--accent); }
  .qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .qa button { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
  .qa button:hover { border-color: var(--line-2); background: var(--hover); }
  .qa b { font-weight: 600; display: block; } .qa .s { font-size: 12px; color: var(--muted); }

  /* Apps */
  .seg { display: inline-flex; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; gap: 2px; flex-wrap: wrap; }
  .seg button { height: 28px; padding: 0 11px; border: 0; background: none; border-radius: 9px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--sel); color: var(--ink); }
  .seg .x { font-size: 11px; color: var(--faint); }
  .seg svg { width: 14px; height: 14px; }
  .tools { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .app-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column;
    gap: 14px; transition: border-color .12s, background .12s; min-width: 0;
  }
  .app-card:hover { border-color: var(--line-2); }
  .app-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .ac-top { display: flex; align-items: center; gap: 12px; }
  .ac-top .nm { flex: 1; min-width: 0; }
  .ac-top b { font-size: 15px; font-weight: 600; display: block; letter-spacing: -.01em; }
  .ac-top .s { font-size: 12px; color: var(--muted); }
  .ac-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12px; color: var(--muted); }
  .ac-meta span { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-meta svg { width: 14px; height: 14px; color: var(--faint); }
  .ac-ft { display: flex; align-items: center; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .found { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--t-sky); font-weight: 500; }
  .found svg { width: 13px; height: 13px; }

  /* An app */
  .app-hd { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .app-hd .grow { flex: 1; min-width: 220px; }
  .app-hd h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
  .app-hd .sub { color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 10px; border: 0; background: none;
    color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rels { list-style: none; margin: 0; padding: 0; }
  .rel { display: flex; gap: 14px; align-items: stretch; position: relative; padding-bottom: 10px; }
  .rel:not(:last-child)::before { content: ""; position: absolute; left: 17px; top: 44px; bottom: 0; width: 1.5px; background: var(--line); }
  .rel .node { width: 36px; height: 36px; margin-top: 10px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--muted); flex: none; }
  .rel .node svg { width: 16px; height: 16px; }
  .rel.live .node { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .rel.failed .node { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
  .rel .body {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .rel .body:hover { border-color: var(--line-2); }
  .rel .what { flex: 1; min-width: 200px; }
  .rel .what b { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 13px; }
  .rel .what .s { display: block; color: var(--muted); font-size: 12px; }

  /* Deploy */
  .pipe { display: flex; align-items: flex-start; overflow-x: auto; padding: 18px 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; }
  .ps { flex: 1; min-width: 70px; display: flex; flex-direction: column; align-items: center; gap: 7px; position: relative; font-size: 11.5px; color: var(--faint); text-align: center; font-weight: 500; }
  .ps:not(:last-child)::after { content: ""; position: absolute; top: 19px; left: calc(50% + 24px); right: calc(-50% + 24px); height: 2px; border-radius: 2px; background: var(--line); }
  .ps.ok:not(:last-child)::after { background: var(--ok); }
  .ps .pi { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--sunk); border: 1px solid var(--line); color: var(--faint); transition: background .2s, color .2s, box-shadow .2s; }
  .ps .pi svg { width: 18px; height: 18px; }
  .ps.ok .pi { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .ps.run .pi { background: var(--run-soft); border-color: transparent; color: var(--run); box-shadow: 0 0 0 5px color-mix(in srgb, var(--run) 14%, transparent); }
  .ps.fail .pi { background: var(--bad-soft); border-color: transparent; color: var(--bad); box-shadow: 0 0 0 5px color-mix(in srgb, var(--bad) 14%, transparent); }
  .ps.skip { opacity: .45; }
  .ps.ok, .ps.run, .ps.fail { color: var(--ink); }
  .ps .pt { font-family: "Geist Mono", monospace; font-size: 10.5px; color: var(--faint); min-height: 15px; font-weight: 400; }
  .now { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .now .grow { flex: 1; min-width: 0; }
  .now b { display: block; font-size: 14px; font-weight: 600; }
  .now .s { color: var(--muted); font-size: 12.5px; }
  .now .bar { height: 6px; margin-top: 10px; } .now .bar i { background: var(--run); }
  .result { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--panel); }
  .result .grow { flex: 1; min-width: 0; } .result b { display: block; font-weight: 600; } .result .s { color: var(--muted); font-size: 12.5px; }

  /* Terminal and code */
  .term { background: var(--term); border-radius: 18px; overflow: hidden; color: var(--term-ink); border: 1px solid #000; }
  .term-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #25252b; flex-wrap: wrap; }
  .term-bar .dots { display: flex; gap: 6px; margin-right: 6px; } .term-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: #34343c; }
  .tbtn { height: 27px; padding: 0 9px; border-radius: 8px; border: 1px solid #2c2c33; background: #18181c; color: #cfcfd6; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .tbtn:hover { background: #202026; } .tbtn.on { background: #23223d; border-color: #3e3a74; color: #fff; }
  .tbtn svg { width: 13px; height: 13px; } .tbtn:disabled { opacity: .45; cursor: not-allowed; }
  .term-bar .find { display: flex; align-items: center; gap: 6px; height: 27px; border-radius: 8px; border: 1px solid #2c2c33; background: #18181c; padding: 0 9px; color: #7a7a86; flex: 1; max-width: 240px; min-width: 120px; }
  .term-bar .find input { border: 0; background: none; outline: none; color: #e6e6ea; width: 100%; font-size: 12px; }
  .term-bar .find svg { width: 13px; height: 13px; }
  .term-bar .src { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 11.5px; color: var(--term-dim); }
  .term-body { height: 420px; overflow: auto; padding: 10px 14px; font: 12px/1.65 "Geist Mono", ui-monospace, Consolas, monospace; white-space: pre; }
  .term-body.wrap { white-space: pre-wrap; word-break: break-word; }
  .ln .t { color: var(--term-dim); } .ln.warn .m { color: #f4c45a; } .ln.err .m { color: #ff7b7b; } .ln.sys .m { color: #8fb4ff; }
  mark { background: #5b4ff5; color: #fff; border-radius: 3px; padding: 0 1px; }
  .code { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; overflow: auto; font: 12px/1.7 "Geist Mono", ui-monospace, Consolas, monospace; white-space: pre; }
  .code .c { color: var(--faint); } .code .k { color: var(--t-violet); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pick { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 5px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }
  .pick:hover { border-color: var(--line-2); } .pick.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }

  /* Files */
  .pathbar { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px 8px; margin-bottom: 12px; font-family: "Geist Mono", monospace; font-size: 12.5px; }
  .pathbar > svg.i { color: var(--t-amber); margin: 0 4px; width: 15px; height: 15px; }
  .pathbar button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--muted); font: inherit; }
  .pathbar button:hover { background: var(--hover); color: var(--ink); }
  .fs { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px; align-items: start; }
  .fl { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px; max-height: 470px; overflow: auto; }
  .f { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 9px; }
  .f:hover { background: var(--hover); } .f.on { background: var(--sel); }
  .f > svg.i { color: var(--tile); }
  .f .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f .sz { font-size: 11.5px; color: var(--faint); font-family: "Geist Mono", monospace; white-space: nowrap; }
  .preview-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }

  /* Adding a project: the whole window, step by step */
  .focus { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 12px 12px; animation: fade .2s; }
  .su-head { display: flex; align-items: center; gap: 12px; padding: 2px 4px 14px; flex-wrap: wrap; }
  .su-head .t { min-width: 160px; flex: 0 1 auto; }
  .su-head h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }

      <span class="pill-btn">${S.online ? '<span class="dot-only ok"></span>Engine 0.7.0' : ic("wifi-off") + "Offline"}</span>
      <button class="icon-btn" data-act="settings" title="Settings (Ctrl+,)" aria-label="Settings">${ic("settings")}</button>
    </div>`;
  if (S.firstRun) return `<div class="home"><div class="home-in">${top}${firstRunHtml()}</div></div>`;
  const cards = D.servers.map(s => {
    const st = srvState(s), list = appsOn(s.id), live = reach(s);
    const m = (icon, tone, label, used, total, unit) => `<div class="mtr ${tone}"><span class="l">${ic(icon)}${label}<b>${live ? `${used}${unit}` : "–"}</b></span><div class="bar"><i style="width:${live ? pct(used, total) : 0}%"></i></div></div>`;

      <div class="sc-apps"><span class="logo-stack">${list.map(a => logo(LANG[a.lang], "sm")).join("")}</span>${list.length} ${list.length === 1 ? "project" : "projects"}${S.connected[s.id] ? ` <span class="chip line">${ic("cable")}<span class="conn-t" data-s="${s.id}">${connText(s.id)}</span></span>` : ""}</div>
      <div class="sc-meters">${m("cpu", "indigo", "CPU", s.cpuHist.at(-1), 100, "%")}${m("memory-stick", "sky", "RAM", s.mem[0], s.mem[1], " GB")}${m("hard-drive", "teal", "Disk", s.disk[0], s.disk[1], " GB")}</div>
      <div class="sc-foot">${esc(s.os)}, ${esc(s.arch)}${live ? `, up ${esc(s.uptime)}` : ""}<span class="go">${S.connected[s.id] ? "Open" : "Connect"}${ic("arrow-right")}</span></div>
    </button>`;
  }).join("");
  const recent = [["my-api", "Today"], ["web", "Yesterday"], ["worker", "3 days ago"]].filter(([id]) => app(id)).map(([id, when]) => {
    const a = app(id);
    return `<button class="rc" data-act="open-app" data-a="${a.id}">${logo(LANG[a.lang], "sm")}<span><b>${esc(a.id)}</b><span class="s">on ${esc(a.server)}, ${when.toLowerCase()}</span></span></button>`;
  }).join("");
  return `<div class="home"><div class="home-in">${top}
    <div class="hero"><div class="sp"><h1>${greeting()}</h1><p>Pick a server. shipdeck connects to it, and you manage its projects from there.</p></div>
      <div class="acts"><button class="btn dark lg" data-act="dlg" data-d="add">${ic("plus")}Add a server</button></div></div>
    <div class="grid-srv">${cards}
      <button class="add-card" data-act="dlg" data-d="add">${tile("plus", "indigo", "lg")}<b>Add a server</b><span class="s">Any Linux server you can reach over SSH.</span></button></div>
    <div class="recent"><p class="grp-title">Opened lately</p><div class="rc-row">${recent}</div></div>
  </div></div>`;
}

/* ---------- Connecting ---------- */

function connectHtml() {
  const c = S.conn, s = server(c.srv), done = c.i >= c.steps.length;
  const list = c.steps.map(x => `<li class="${x.st}"><span class="st">${x.st === "ok" ? ic("check") : x.st === "fail" ? ic("x") : x.st === "run" ? ic("loader-circle", "spin") : ic(x.icon)}</span>
      <span class="nm">${esc(x.name)}${x.st === "ok" || x.st === "fail" ? `<span class="dt">${esc(x.det)}</span>` : ""}</span></li>`).join("");
  const acts = c.fail
    ? `<button class="btn" data-act="home">${ic("arrow-left")}Back to servers</button><button class="btn" data-act="cached" data-s="${s.id}">${ic("history")}Open what shipdeck saw</button><button class="btn dark" data-act="retry">${ic("refresh-cw")}Try again</button>`
    : `<button class="btn" data-act="cancel-connect">Cancel</button>`;
  return `<div class="connect"><div class="cn">
    <div class="cn-art"><span class="cn-node">${ic("laptop")}</span><span class="cn-wire ${c.fail ? "fail" : done ? "ok" : ""}"></span><span class="cn-node">${logo(s.logo)}</span></div>
    <h2>${c.fail ? `Can't reach ${esc(s.id)}` : done ? `Connected to ${esc(s.id)}` : `Connecting to ${esc(s.id)}`}</h2>
    <p class="sub mono">${esc(s.user)}@${esc(s.host)}</p>
    <ul class="checks">${list}</ul>
    <div class="acts">${acts}</div>
  </div></div>`;
}

/* ---------- The server workspace ---------- */

function isDark() { return S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches); }

function sideHtml(s) {
  const r = S.route, here = r.page === "app" ? "apps" : r.page;
  const items = NAV.map(([g, list]) => `<div class="grp">${g}</div>` + list.map(([k, name, icon, tone]) => `
      <button class="nav-i ${tone}${here === k ? " on" : ""}" data-act="page" data-p="${k}">${ic(icon)}<span class="n">${name}</span>${
        LATER[k] ? '<span class="soon">Soon</span>' : k === "apps" ? `<span class="x">${appsOn(s.id).length}</span>` : ""}</button>`).join("")).join("");
  const pop = !S.pop ? "" : `<div class="sw-pop" role="menu">
      <div class="pop-g">Servers</div>
      ${D.servers.map(x => `<button class="pop-i" data-act="switch" data-s="${x.id}">${logo(x.logo, "sm")}<span class="nm"><b>${esc(x.id)}</b><span class="s conn-t" data-s="${x.id}">${connText(x.id)}</span></span>${x.id === s.id ? ic("check") : S.connected[x.id] ? ic("cable") : ""}</button>`).join("")}
      <div class="pop-sep"></div>
      <button class="pop-i" data-act="home">${ic("house")}<span class="nm">All servers</span></button>
      <button class="pop-i" data-act="dlg" data-d="add">${ic("plus")}<span class="nm">Add a server</span></button>
      <button class="pop-i" data-act="disconnect" data-s="${s.id}">${ic("unplug")}<span class="nm">Disconnect from ${esc(s.id)}</span></button>
    </div>`;
  return `<aside class="side${S.enter ? " enter" : ""}${S.sideOpen ? " open" : ""}" id="side">
    <button class="srv-sw${S.pop ? " on" : ""}" data-act="pop" aria-haspopup="menu">${logo(s.logo, "sm")}<span class="nm"><b>${esc(s.id)} <span class="dot-only ${srvState(s).cls}"></span></b><span class="mono">${esc(s.user)}@${esc(s.host)}</span></span>${ic("chevrons-up-down")}</button>
    ${pop}
    <nav class="side-nav">${items}</nav>
    <div class="side-ft">${opMini()}
      <button class="side-add" data-act="new-app">${ic("plus")}Add a project</button>
      <div class="eng">${S.online ? '<span class="dot-only ok"></span>Engine 0.7.0' : ic("wifi-off") + "Offline"}<span class="sp"></span>
        <button class="icon-btn" data-act="settings" title="Settings (Ctrl+,)" aria-label="Settings">${ic("settings")}</button>
        <button class="icon-btn" data-act="disconnect" data-s="${s.id}" title="Disconnect" aria-label="Disconnect">${ic("log-out")}</button></div>
    </div>
  </aside>`;
}

function opMini() {
  const o = S.op;
  if (!o) return '<span id="opmini" hidden></span>';
  const cur = o.steps[Math.min(o.i, o.steps.length - 1)];
  const what = o.kind === "rollback" ? "Rolling back" : "Deploying";
  const cls = o.done ? (o.ok ? "ok" : "bad") : "";
  return `<div class="op-mini ${cls}" id="opmini" data-act="open-op">
    <div class="row">${o.done ? ic(o.ok ? "circle-check" : "circle-x") : '<span class="dot-only run"></span>'}<span>${o.done ? (o.ok ? "Finished" : "Stopped") : what} <b>${esc(o.app)}</b></span></div>
    ${o.done ? `<span class="s">${esc(o.summary)}</span>` : `<span class="s">${esc(cur.name)}${cur.pct != null ? `, ${cur.pct}%` : ""} · on ${esc(app(o.app).server)}</span><div class="bar"><i style="width:${pct(o.i, o.steps.length)}%"></i></div>`}
  </div>`;
}

function crumbs(s) {
  const r = S.route, n = NAV_BY[r.page === "app" ? "apps" : r.page];
  const sep = `<span class="sep">${ic("chevron-right")}</span>`;
  const srv = `<button data-act="home" title="All servers. ${esc(s.id)} stays connected.">${ic("house")}Servers</button>${sep}<button data-act="page" data-p="overview">${logo(s.logo, "xs")}${esc(s.id)}</button>`;
  if (r.page === "overview") return srv;
  if (r.page === "app") return `${srv}${sep}<button data-act="page" data-p="apps">${ic(n[2])}Projects</button>${sep}<span class="here">${logo(LANG[app(r.app).lang], "xs")}${esc(r.app)}</span>`;
  return `${srv}${sep}<span class="here">${ic(n[2])}${n[1]}</span>`;
}

function renderWs() {
  const r = S.route, s = server(r.srv);
  if (r.page === "app" && !app(r.app)) r.page = "apps";
  if (r.page === "setup" && !draft(r.draft)) r.page = "apps";
  // Setting up an app takes the whole window: no sidebar, nothing else to look at.
  if (r.page === "setup") {
    const keepForm = S.lastKey === "setup:" + r.draft ? ($("#su-form")?.scrollTop || 0) : 0;
    $("#app").innerHTML = pSetup(s);
    S.enter = false; S.lastKey = "setup:" + r.draft;
    const sf = $("#su-form"); if (sf) sf.scrollTop = keepForm;
    return;
  }
  const key = JSON.stringify([r.srv, r.page, r.app, r.tab]);
  const keep = S.lastKey === key ? ($(".content")?.scrollTop || 0) : 0;
  const pages = { overview: pOverview, apps: pApps, app: pApp, deploys: pDeploys, logs: pLogs, files: pFiles, access: pAccess, settings: pSettings };
  const body = LATER[r.page] ? pLater(r.page) : pages[r.page](s);
  const cached = !reach(s);
  $("#app").innerHTML = `<div class="ws">${sideHtml(s)}
    <main class="main">
      <div class="topbar"><button class="icon-btn menu-btn" data-act="side" aria-label="Menu">${ic("panel-left")}</button>
        <div class="crumbs">${crumbs(s)}</div>
        <button class="kbtn" data-act="palette">${ic("search")}<span class="lbl">Search or jump to…</span><kbd>Ctrl K</kbd></button></div>
      <div class="content">
        ${cached ? `<div class="offline">${ic("wifi-off")}<span><b>${S.online ? `Can't reach ${esc(s.id)}.` : "You are offline."}</b> This is what shipdeck saw ${S.online ? esc(s.seen) : "at 11:42"}. Buttons that change the server stay off until it connects.</span>
          <button class="btn sm" data-act="retry-srv" data-s="${s.id}">${ic("refresh-cw")}Try again</button></div>` : ""}
        ${body}
      </div>
    </main></div>`;
  S.enter = false; S.lastKey = key;
  $(".content").scrollTop = keep;
  if (logTarget()) paintLogs(true);
}

/* ---------- Pages ---------- */

function spark(vals, tone) {
  const w = 120, h = 30, max = 50, step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - Math.min(v, max) / max * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${pts} ${w},${h}" fill="var(--t-${tone})" opacity=".12"/><polyline points="${pts}" fill="none" stroke="var(--t-${tone})" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const EV = { deploy: ["rocket", "indigo", "Deployed"], rollback: ["undo-2", "amber", "Rolled back"], failed: ["circle-x", "rose", "Failed"], stopped: ["circle-pause", "slate", "Stopped"] };
const eventsOn = sid => D.events.filter(e => app(e.app) && app(e.app).server === sid);

function pOverview(s) {
  const list = appsOn(s.id), live = reach(s), running = list.filter(a => a.status === "running").length;
  const stat = (icon, tone, label, v, small, extra) => `<div class="stat ${tone}"><div class="top">${tile(icon, tone, "sm")}${label}</div><div class="v">${v}<small>${small}</small></div>${extra}</div>`;
  const ev = eventsOn(s.id).slice(0, 5);
  return `<div class="page-hd"><div class="grow"><h1>${esc(s.id)}</h1>
      <div class="sub">${chip(srvState(s))}<span>${esc(s.os)}, ${esc(s.arch)}</span>${live ? `<span>· up ${esc(s.uptime)}</span>` : ""}</div></div>
      <div class="acts"><button class="btn" data-act="page" data-p="files">${ic("folder-tree")}Files</button><button class="btn dark" data-act="new-app">${ic("plus")}Add a project</button></div></div>
    <div class="stats">
      ${stat("folder-git-2", "violet", "Projects", list.length, `${running} running`, `<div class="logo-stack">${list.map(a => logo(LANG[a.lang], "sm")).join("")}</div>`)}
      ${stat("cpu", "indigo", "CPU", live ? s.cpuHist.at(-1) + "%" : "–", `${s.cpu} cores`, `<span id="cpu-spark">${spark(s.cpuHist, "indigo")}</span>`)}
      ${stat("memory-stick", "sky", "Memory", live ? s.mem[0] : "–", `of ${s.mem[1]} GB`, `<div class="bar sky"><i style="width:${live ? pct(s.mem[0], s.mem[1]) : 0}%"></i></div>`)}
      ${stat("hard-drive", "teal", "Disk", live ? s.disk[0] : "–", `of ${s.disk[1]} GB`, `<div class="bar teal"><i style="width:${live ? pct(s.disk[0], s.disk[1]) : 0}%"></i></div>`)}
    </div>
    <div class="cols">
      <div class="card"><div class="card-hd">${tile("folder-git-2", "violet", "sm")}<h2>Projects</h2><button class="more" data-act="page" data-p="apps">See all${ic("arrow-right")}</button></div>
        ${list.map(a => `<button class="row-i" data-act="app" data-a="${a.id}" data-ctx="app:${a.id}">${logo(LANG[a.lang])}<span class="nm"><b>${esc(a.id)}</b><span class="s mono">${esc(liveTag(a))}</span></span>${chip(appState(a))}${ic("chevron-right")}</button>`).join("") || '<p class="muted" style="margin:0">No projects yet.</p>'}
      </div>
      <div class="stack">
        <div class="card"><div class="card-hd">${tile("activity", "orange", "sm")}<h2>Activity</h2><button class="more" data-act="page" data-p="deploys">See all${ic("arrow-right")}</button></div>
          <ul class="tl">${ev.map(evHtml).join("") || '<li class="muted">Nothing yet.</li>'}</ul></div>
        <div class="card"><div class="card-hd">${tile("zap", "amber", "sm")}<h2>Quick actions</h2></div>
          <div class="qa">
            <button data-act="page" data-p="apps">${tile("rocket", "orange")}<span><b>Deploy</b><span class="s">Pick a project</span></span></button>
            <button data-act="page" data-p="logs">${tile("scroll-text", "sky")}<span><b>Logs</b><span class="s">Live from the server</span></span></button>
            <button data-act="page" data-p="files">${tile("folder-tree", "amber")}<span><b>Files</b><span class="s">Read-only</span></span></button>
            <button data-act="new-app">${tile("plus", "violet")}<span><b>Add a project</b><span class="s">From a folder or Git</span></span></button>
          </div></div>
      </div>
    </div>`;
}
function evHtml(e) {
  const [icon, tone, verb] = EV[e.kind];
  return `<li>${tile(icon, tone, "round")}<span class="tx"><b>${verb}</b> <span class="app-link" data-act="app" data-a="${e.app}">${esc(e.app)}</span> <span class="mono">${esc(e.tag)}</span>
    <span class="s">${esc(e.when)}${e.took ? `, took ${esc(e.took)}` : ""}${e.note ? `, ${esc(e.note)}` : ""}</span></span></li>`;
}

function pApps(s) {
  const list = appsOn(s.id), drafts = D.drafts.filter(d => d.server === s.id && !d.app);
  const f = S.appFilter, n = { all: list.length, running: list.filter(a => a.status === "running").length, stopped: list.filter(a => a.status !== "running").length, found: list.filter(a => !a.local).length };
  const shown = list.filter(a => f === "all" || (f === "running" ? a.status === "running" : f === "stopped" ? a.status !== "running" : !a.local));
  const seg = [["all", "All", "layout-grid"], ["running", "Running", "circle-play"], ["stopped", "Stopped", "circle-pause"], ["found", "Found on the server", "radar"]]
    .map(([k, l, i]) => `<button class="${f === k ? "on" : ""}" data-act="filter" data-f="${k}">${ic(i)}${l}<span class="x">${n[k]}</span></button>`).join("");
  return `<div class="page-hd"><div class="grow"><h1>Projects</h1><p class="sub">Your projects on ${esc(s.id)}. Open one to deploy it, read its logs or roll it back.</p></div>
      <div class="acts"><button class="btn dark" data-act="new-app">${ic("plus")}Add a project</button></div></div>
    <div class="tools"><div class="seg">${seg}</div></div>
    ${drafts.length ? `<p class="grp-title">Drafts</p><div class="apps-grid" style="margin-bottom:24px">${drafts.map(draftCard).join("")}</div><p class="grp-title">Projects</p>` : ""}
    <div class="apps-grid">${shown.map(appCard).join("")}</div>`;
}
function appCard(a) {
  const s = server(a.server), live = reach(s), cur = a.releases[0];
  const why = deployWhy(a);
  return `<div class="app-card" data-act="app" data-a="${a.id}" data-ctx="app:${a.id}">
    <div class="ac-top">${logo(LANG[a.lang], "lg")}<span class="nm"><b>${esc(a.id)}</b><span class="s">${esc(a.lang)}, ${esc(a.runner)}</span></span>${chip(appState(a))}</div>
    <div class="ac-meta">
      <span>${ic("git-commit-horizontal")}<span class="mono">${esc(cur ? cur.tag : "none yet")}</span></span>
      <span>${ic("clock")}${esc(a.deployed)}</span>
      <span>${ic("heart-pulse")}${a.health ? (live ? "Healthy" : "Unknown") : "No health check"}</span>
      <span>${ic("memory-stick")}${live && a.mem && a.status === "running" ? esc(a.mem) : "–"}</span>
    </div>
    <div class="ac-ft">${a.local ? `<span class="faint" style="font-size:12px;display:flex;align-items:center;gap:6px">${ic("laptop")}On this PC</span>` : `<span class="found">${ic("radar")}Found on the server</span>`}<span class="sp"></span>
      <button class="btn sm sq" data-act="app" data-a="${a.id}" data-t="logs" title="Logs" aria-label="Logs">${ic("scroll-text")}</button>
      <button class="btn sm sq" data-act="svc" data-a="${a.id}" data-v="restart" title="Restart" aria-label="Restart" ${!live || busy() || a.status !== "running" ? "disabled" : ""}>${ic("rotate-cw")}</button>
      <button class="btn sm dark" data-act="deploy" data-a="${a.id}" ${why ? `disabled title="${esc(why)}"` : ""}>${ic("rocket")}Deploy</button></div>
  </div>`;
}
function deployWhy(a) {
  const s = server(a.server), opHere = S.op && S.op.app === a.id;
  if (!reach(s)) return "Needs a live connection";
  if (opHere && !S.op.done) return "This project is deploying now";
  if (busy()) return `Another deploy is running (${S.op.app}). One at a time.`;
  if (!a.local) return "No shipdeck.yaml on this PC. Link the project's folder first.";
  return "";
}

/* An app */
function pApp(s) {
  const r = S.route, a = app(r.app), live = reach(s), opHere = S.op && S.op.app === a.id;
  let tab = r.tab || (opHere && !S.op.done ? "deploy" : "overview");
  if (tab === "deploy" && !opHere) tab = "overview";
  r.tab = tab;
  const tabs = [["overview", "Overview", "layout-dashboard"], ["releases", "Releases", "history"], ["logs", "Logs", "scroll-text"], ["config", "Config", "file-code"]];
  if (opHere) tabs.push(["deploy", S.op.kind === "rollback" ? "Rollback" : "Deploy", "rocket"]);
  const why = deployWhy(a), other = busy() && !opHere;
  const off = !live || busy();

/* Logs */
const LOG_MSGS = {
  "my-api": [["INFO", "GET /v1/items 200 3ms"], ["INFO", "GET /health 200 0ms"], ["INFO", "POST /v1/orders 201 12ms"], ["WARN", "slow query: orders.list took 412ms"], ["INFO", "GET /v1/items/42 200 2ms"], ["ERROR", "POST /v1/login 401 invalid token"]],
  web: [["info", "GET / 200 18ms"], ["info", "GET /assets/app.3f9c.js 200 1ms"], ["info", "GET /pricing 200 22ms"], ["warn", "cache miss for /blog"]],
  reports: [["INFO", "built daily report in 1.8s"], ["INFO", "sent 3 emails"], ["INFO", "next run at 06:00"]],
  worker: [["INFO", "job 913 done in 220ms"]],
  blog: [["info", "GET / 200 9ms"]],
  metrics: [["INFO", "scraped 42 targets in 310ms"]],
  "api-gateway": [["INFO", "listening on 127.0.0.1:9000"], ["INFO", "GET /health 200 0ms"]],
};
let clock = 11 * 3600 + 42 * 60;
const stamp = () => { clock += 1 + Math.floor(Math.random() * 3); const h = Math.floor(clock / 3600) % 24, m = Math.floor(clock / 60) % 60, s = clock % 60; return `Oct 31 ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };
function logLine(a) {
  const pool = LOG_MSGS[a.id] || [["INFO", "ok"]], [lvl, msg] = pool[Math.floor(Math.random() * pool.length)];
  return { t: stamp(), m: `${a.id}[${a.pid || 0}]: ${lvl} ${msg}`, cls: /warn/i.test(lvl) ? "warn" : /err/i.test(lvl) ? "err" : "" };
}
function logsOf(a) {
  if (!S.logs[a.id]) {
    S.logs[a.id] = [];
    for (let i = 0; i < 40; i++) S.logs[a.id].push(logLine(a));
    S.logs[a.id].push({ t: "", m: `${a.id}[${a.pid || 0}]: INFO a long line, to show wrapping: {"user":"u_1042","path":"/v1/orders","items":[{"sku":"A-100","qty":2},{"sku":"B-220","qty":1}],"total":"48.00","currency":"EUR","took_ms":12}`, cls: "" });
  }
  return S.logs[a.id];
}
function logTarget() {
  const r = S.route;
  if (r.at !== "srv") return null;
  if (r.page === "app" && r.tab === "logs") return app(r.app);
  if (r.page === "logs") return logApp(server(r.srv));
  return null;
}
function logApp(s) {
  const a = app(S.logApp);
  if (a && a.server === s.id) return a;
  const list = appsOn(s.id);
  return list.find(x => x.status === "running") || list[0] || null;
}
function pLogs(s) {
  const a = logApp(s);
  if (!a) return `<div class="page-hd"><div class="grow"><h1>Logs</h1></div></div><p class="muted">No projects on this server yet.</p>`;
  return `<div class="page-hd"><div class="grow"><h1>Logs</h1><p class="sub">Live lines from each project on ${esc(s.id)}.</p></div></div>
    <div class="chips">${appsOn(s.id).map(x => `<button class="pick${x === a ? " on" : ""}" data-act="log-app" data-a="${x.id}">${logo(LANG[x.lang], "xs")}${esc(x.id)}<span class="dot-only ${appState(x).cls}"></span></button>`).join("")}</div>
    ${appLogs(a, s)}`;
}
function appLogs(a, s) {
  const live = reach(s), on = S.follow && live && a.status === "running";
  return `<div class="term">
    <div class="term-bar"><span class="dots"><i></i><i></i><i></i></span>
      <button class="tbtn${on ? " on" : ""}" data-act="follow" ${live ? "" : "disabled"}>${ic(on ? "pause" : "play")}${on ? "Following" : "Paused"}</button>
      <button class="tbtn${S.wrap ? " on" : ""}" data-act="wrap">${ic("wrap-text")}Wrap</button>
      <label class="find">${ic("search")}<input id="logq" placeholder="Find in logs" value="${esc(S.logq)}"></label>
      <span class="src">${a.runner === "systemd" ? `journalctl -u ${esc(a.id)}` : `pm2 logs ${esc(a.id)}`}</span>
    </div>
    <div class="term-body${S.wrap ? " wrap" : ""}" id="logbody"></div>
  </div>
  ${live ? "" : '<p class="faint" style="margin-top:10px">These are the last lines shipdeck saw. New lines come back when the server connects.</p>'}`;
}
function paintLogs(toEnd) {
  const el = $("#logbody"), a = logTarget();
  if (!el || !a) return;
  const q = S.logq.toLowerCase();
  const atEnd = toEnd || el.scrollHeight - el.scrollTop - el.clientHeight < 30;

  const hi = m => { const e = esc(m); if (!q) return e; const i = e.toLowerCase().indexOf(esc(q)); return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + esc(q).length) + "</mark>" + e.slice(i + esc(q).length); };
  el.innerHTML = lines.map(l => `<div class="ln ${l.cls}">${l.t ? `<span class="t">${l.t}</span> ` : ""}<span class="m">${hi(l.m)}</span></div>`).join("") || '<div class="ln sys"><span class="m">No line matches.</span></div>';
  if (atEnd && S.follow) el.scrollTop = el.scrollHeight;
}
setInterval(() => {

/* Files */
function pFiles(s) {
  const head = `<div class="page-hd"><div class="grow"><h1>Files</h1><p class="sub">Read-only. You see what the user <code>${esc(s.user)}</code> can see.</p></div></div>`;
  if (!reach(s)) return head + `<div class="later"><div class="tile big amber" style="margin:20px auto 34px">${ic("wifi-off")}</div><p class="lead">Files need a live connection.</p></div>`;
  const path = S.path[s.id] || "/";
  const parts = path === "/" ? [] : path.slice(1).split("/");
  const bar = `${ic("hard-drive")}<button data-act="cd" data-p="/">/</button>` + parts.map((p, i) => `<button data-act="cd" data-p="/${parts.slice(0, i + 1).join("/")}">${esc(p)}</button>${i < parts.length - 1 ? "/" : ""}`).join("");
  const entries = s.id === "prod-1" ? FS[path] : (path === "/" ? FS["/"] : null);
  const join = n => (path === "/" ? "" : path) + "/" + n;
  const fileIcon = n => n === ".env" ? ["file-lock", "rose"] : /\.(json)$/.test(n) ? ["file-json", "teal"] : /\.(service|yaml|toml)$|^(hostname|os-release|\.profile)$/.test(n) ? ["file-cog", "violet"] : ["file", "slate"];
  const list = entries ? entries.map(([n, t, x]) => {
    const p = join(n);
    if (t === "dir") return `<div class="f amber" data-act="cd" data-p="${esc(p)}">${ic("folder")}<span class="nm">${esc(n)}</span>${ic("chevron-right")}</div>`;
    if (t === "link") return `<div class="f sky" data-act="cd" data-p="${esc(p)}">${ic("link")}<span class="nm">${esc(n)}</span><span class="sz">→ ${esc(x)}</span></div>`;
    const [fi, tone] = fileIcon(n);
    return `<div class="f ${tone}${S.file === p ? " on" : ""}" data-act="open-file" data-p="${esc(p)}">${ic(fi)}<span class="nm">${esc(n)}</span><span class="sz">${esc(x)}</span></div>`;
  }).join("") : `<div class="f" style="cursor:default"><span class="nm faint">Nothing to show in this mockup.</span></div>`;
  const prev = S.file ? `<div><div class="preview-hd">${ic("eye")}<span class="mono">${esc(S.file)}</span></div><pre class="code">${FILE_TEXT[S.file] || '<span class="c">No preview in this mockup.</span>'}</pre></div>`
                      : `<div class="card" style="text-align:center;padding:40px 18px">${tile("mouse-pointer-click", "amber", "lg")}<p class="muted" style="margin:12px 0 0">Pick a file to read it.</p></div>`;
  return head + `<div class="pathbar">${bar}</div><div class="fs"><div class="fl">${list}</div>${prev}</div>`;
}
