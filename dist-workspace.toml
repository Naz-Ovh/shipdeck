[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# The release is the draft you write in GitHub: dist uploads the binaries into
# it and then publishes it, so a release is never public without them
create-release = false
# The release workflow runs for version tags only, never for pull requests
pr-run-mode = "skip"
# Stops every build job before it compiles when no draft waits for the tag
github-build-setup = "../build-setup.yml"
# Global artifacts jobs to run in CI
global-artifacts-jobs = ["./glibc-floor"]
# Deploys the docs site once the release is out
post-announce-jobs = ["./docs"]

# The oldest glibc that gets the gnu build; anything older, and every musl
# system, gets the static musl build. dist would otherwise guess it from the
# build machine, so it is set here and glibc-floor.yml checks the binaries.
[dist.min-glibc-version]
"*" = "2.28"

# gnu builds run in an old-glibc container: the container's glibc is the floor.
# dist itself runs there as its static musl build.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

# native arm runner, so musl-gcc builds the C parts instead of a cross compiler
[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "ubuntu-24.04-arm"
