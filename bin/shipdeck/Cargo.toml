[package]
name = "shipdeck"
description = "Builds locally, deploys over SSH and rolls back any release, in a terminal UI or from scripts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
shipdeck-engine.workspace = true
shipdeck-headless.workspace = true
shipdeck-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
inquire.workspace = true
tokio.workspace = true

# build.rs reads the manual's YAML once, at build time
[build-dependencies]
granit-parser.workspace = true

[dev-dependencies]
serde_json.workspace = true

# musl's own malloc is the main reason musl builds run slower than gnu ones;
# gnu and macOS keep their system allocator
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[package.metadata.dist]
# dist skips packages with publish = false unless told otherwise
dist = true

