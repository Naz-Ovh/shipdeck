# Steps dist puts at the start of every build job in release.yml
# (github-build-setup in dist-workspace.toml), before anything compiles.

# A release fills the draft written for its tag (create-release = false), so a
# tag without a draft would build everything and then fail. Stop early instead.
- name: Stop unless a draft release waits for this tag
  run: |
    curl -fsSL \
      -H "Authorization: Bearer $GH_TOKEN" \
      -H "Accept: application/vnd.github+json" \
      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
    python3 - "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" <<'EOF'
    import json, sys
    path, tag = sys.argv[1], sys.argv[2]
    releases = json.load(open(path))
    if not any(r["draft"] and r["tag_name"] == tag for r in releases):
        sys.exit(
            f"No draft release for {tag}. Draft one in GitHub (Releases, "
            f"Draft a new release, tag {tag}), then re-run this workflow."
        )
    print(f"Draft release for {tag} found")
    EOF
