# A Rust service: compiled here, only the binary and its .env travel.
name: My API (prod)

ssh:
  host: prod            # an address, or an alias from ~/.ssh/config
  user: deploy          # optional when the alias has a User

build:
  cwd: ../../../my-api  # relative to this folder
  # Build against the server's glibc so the binary runs there:
  # cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31
  command: [cargo, build, --release, -p, my-api]
  binary: target/release/my-api
  # version_from: ../../../my-api/Cargo.toml   # found in build.cwd when unset

remote:
  dir: /opt/my-api
  service: my-api
  args: [-E=.env]       # after the binary in ExecStart=

bundle:
  - .env                # from this folder; gitignored

health:
  url: http://127.0.0.1:8080/health
  timeout_secs: 20
