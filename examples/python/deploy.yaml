# yaml-language-server: $schema=https://raw.githubusercontent.com/Naz-Ovh/shipdeck/v0.4.0/deploy.schema.json
# A Python app: the source ships as it is; the server builds its virtualenv.
name: Reports (prod)
project: ../../../reports

ssh:
  host: prod
  user: deploy

service:
  name: reports
  dir: /opt/reports
  start: .venv/bin/python -m app
  env_file: .env

pipeline:
  preflight:
    requires: [python3]
    run:
      local: python3 -m pytest -q
  pack:
    files:
      include:
        project: [.]              # the whole project...
        deploy: [.env]
      exclude:
        project: [tests, "**/__pycache__", .venv, "**/*.pyc"]   # ...but these
  setup:
    run:
      server:
        - python3 -m venv .venv
        - .venv/bin/pip install -q -r requirements.txt
    check:
      server: .venv/bin/python -c "import app"
